dependencies {
    // 物理库
    try {
        // workspace加载模块时
        implementation(project(':Spark-Core')) //模块化加载
    } catch (Exception ignore) { // 失败，说明是单独作为项目时运行
        implementation("io.github.solarmoonqaq:spark-core-${mod_loader}:${spark_core_version}") //默认加载
    }
    // 弹道框架
    try {
        // workspace加载模块时
        implementation(project(':BallisticsFramework'))
        jarJar(project(':BallisticsFramework'))
    } catch (Exception ignore) { // 失败，说明是单独作为项目时运行
        implementation("io.github.sweetzonzi:ballistics_framework-${minecraft_version}:${ballistics_framework_version}")
        jarJar("io.github.sweetzonzi:ballistics_framework-${minecraft_version}:${ballistics_framework_version}")
    }
    // jei
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // 玉（编译期可见，运行时可选）
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    // Kotlin
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"
    // js
    compileOnly "org.mozilla:rhino:1.8.0"
    // 暴雪粒子
//    implementation files('libs/particlestorm-1.1.4.jar')
    // 状态机
    implementation("io.github.nsk90:kstatemachine-jvm:0.33.0")
    // 加速渲染
    implementation("maven.modrinth:acceleratedrendering:1.0.5-1.21.1-alpha")
    // AUI渲染引擎（独立mod，不打包）
    implementation files("libs/ApricityUI-neoforge-1.21.1-${aui_version}.jar")
    // 机械动力
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    // 其他mod
    runtimeOnly files(fileTree(dir: 'mods', includes: ['*.jar']))
    // Lombok 配置
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}

