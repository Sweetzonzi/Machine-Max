def upstreamRepo = providers.gradleProperty('mmUpstreamRepo').orNull
def useUpstreamSources = providers.gradleProperty('mmUseUpstreamSources').map { it.toBoolean() }.getOrElse(false)
def sparkGroup = 'io.github.solarmoonqaq'
def sparkArtifact = "spark-core-${mod_loader}"
def ballisticsGroup = 'io.github.sweetzonzi'
def ballisticsArtifact = "ballistics_framework-${minecraft_version}-${mod_loader}"

dependencies {
    // 物理库
    def sparkDependency = useUpstreamSources && project.findProject(':Spark-Core') != null
            ? project(':Spark-Core') : "${sparkGroup}:${sparkArtifact}:${spark_core_version}"
    implementation(sparkDependency)
    // 弹道框架
    def ballisticsDependency = useUpstreamSources && project.findProject(':BallisticsFramework') != null
            ? project(':BallisticsFramework') : "${ballisticsGroup}:${ballisticsArtifact}:${ballistics_framework_version}"
    implementation(ballisticsDependency)
    jarJar(ballisticsDependency)

    if (!useUpstreamSources) {
        // Spark-Core 的发布 POM 不传递兼容模组；在默认二进制模式保留其开发运行依赖。
        localRuntime "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.7.7"
        localRuntime "mod.azure.azurelib:azurelib-neo-${minecraft_version}:${azurelib_version}"
        localRuntime 'dev.kosmx.player-anim:player-animation-lib-forge:2.0.0-alpha1+1.21'
    }
    // jei
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // 玉（编译期可见，运行时可选）
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    // Kotlin
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"
    // js（通过 KubeJS 的 Rhino fork 统一提供）
    implementation "maven.modrinth:rhino:${rhino_version}"
    // 状态机由 Spark-Core 打进自己的 jar，本模组不直接引用 ru.nsk.kstatemachine，
    // 不再单独声明；两份不同版本的接口会让动画状态机在运行时抛 AbstractMethodError。
    // 加速渲染
    implementation("curse.maven:accelerated-rendering-1314021:8366742")
    // AUI渲染引擎（jarJar 内嵌进本模组 jar，玩家无需单独安装）
    implementation("com.sighs:ApricityUI-neoforge-1.21.1:${aui_version}")
    jarJar("com.sighs:ApricityUI-neoforge-1.21.1:${aui_version}")
    // 机械动力
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    // KubeJS（编译 + 运行时依赖）
    implementation "maven.modrinth:kubejs:${kubejs_version}"
    // 其他mod
    //
    // 开发期第三方 jar：jar 不入库，放置说明见各目录 README.md；落点与判据见 build.gradle 与 AGENTS.md。
    devServerMods files(fileTree(dir: 'mods', includes: ['*.jar']))
    devClientMods files(fileTree(dir: 'mods-client', includes: ['*.jar']))
    // Lombok 配置
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}

repositories {
    if (upstreamRepo != null) {
        if (upstreamRepo.isBlank() || !file(upstreamRepo).isDirectory()) {
            throw new GradleException("mmUpstreamRepo must point to an existing local Maven repository: '${upstreamRepo}'")
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'MachineMaxUpstreamBinaries'
                    url = uri(file(upstreamRepo))
                }
            }
            filter {
                includeModule(sparkGroup, sparkArtifact)
                includeModule(ballisticsGroup, ballisticsArtifact)
            }
        }
    }
    mavenLocal()
    mavenCentral()

    // 下面每个仓库都用 includeGroup 收窄到它实际提供的 group。Gradle 只向
    // “group 被包含”的仓库查询该模块，因此某个仓库超时或 5xx 只影响它自己那几个
    // group，不会拖死整条解析链——group 写得过窄时表现为 “Could not find …”，
    // 列出所有已查仓库，新依赖落到陌生 group 时要在这里补一条。
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name "KosmX's maven"
        url = 'https://maven.kosmx.dev/'
        content {
            includeGroupByRegex "dev\\.kosmx\\..*"
        }
    }
    maven {
        name = "Create Maven"
        url = "https://maven.createmod.net"
        content {
            includeGroupByRegex "com\\.simibubi\\..*"
            includeGroupByRegex "net\\.createmod\\..*"
            includeGroupByRegex "dev\\.engine-room\\..*"
        }
    }
    maven {
        name = "IThundxr Snapshots"
        url = "https://maven.ithundxr.dev/snapshots"
        content {
            includeGroup "com.tterrag.registrate"
        }
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content {
            includeGroup "thedarkcolour"
        }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        url = 'https://maven.azuredoom.com/mods'
        content {
            includeGroupByRegex "mod\\.azure\\..*"
        }
    }
    maven {
        name = "Sighs Maven"
        url = "https://maven.sighs.cc/repository/maven-releases/"
        content {
            includeGroup "com.sighs"
            includeGroupByRegex "io\\.github\\.(solarmoonqaq|sweetzonzi)"
        }
    }
    flatDir {
        dir 'libs'
        dir 'libs/jNativeLib'
    }
}
