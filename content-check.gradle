// 内容包引用检查。
//
//   ./gradlew checkContent    只读校验（check 依赖它，CI 的 build 因此也会跑）
//
// 下列问题都只能靠读 JSON 发现，编译期不会报：
//
//  1. 装配体 / 载具蓝图与模板对齐。创造栏的两个页签按模板 id 生成物品，物品里存的是
//     模板 id，读取时再拿它去 assemblies/、blueprints/ 查同名条目。文件名与模板不同名、
//     template 字段多带了后缀、或者整条缺失，物品都在但放不出车。
//  2. JSON 里引用的资源可达。图标少写一层目录、图标改名后引用没跟上、模型改名漏同步，
//     在游戏里只表现为紫黑格子或空模型，不报错。
//  3. 材质的表现粒子可达。材质 particles 段里的 id（hit_pen / hit_un_pen …）写错一个字母，
//     游戏里只是打中装甲不出火花，既不报错也不刷日志（客户端解析不到定义时静默跳过）。
//  4. 粒子定义之间的子效果引用可达。粒子 JSON 的 events 里用 particle_effect 生成另一个
//     效果时，效果 id 拼错只会让子效果不出现（如只剩火花、没有闪光与烟尘），同样没有日志。
//  5. 语言键可达且中英成对。零件改名后残留的旧键、写错前缀的键（fitting.<ns>.<id> 与
//     FittingType.nameKey 的 <ns>.fitting.<id> 相反）在游戏里只表现为屏幕上一段原始键名；
//     只有一边语言有的键则让另一边显示原始键名。两者都不报错。
//
// 扫描前先按运行期口径做一遍语法体检：`{"a":1,}` 这类对象尾逗号 JsonSlurper 读得进去，
// 而运行期读内容包的 Gson（JsonParser.parseString，宽松模式）会抛 Expected name，
// 结果是整份文件读不出来——模板读不出来就放不出车，配件读不出来则那个子系统整条消失。
//
// 口径：
//  - 只扫各包的 <namespace>/ 目录，跳过 docs/（schema 副本由 checkSchemas 管）。
//  - `.png` 按内容目录内的相对路径精确匹配；`.geo` 按文件名在 models/ 下递归找（各包
//    的 models 子目录布局不一致，有 models/part、models/fitting，也有平铺的）。
//  - `.html` 按 AUI 文档根解析（namespace:tooltips/x.html → <namespace>/documents/tooltips/x.html），
//    缺页面只做汇总提示、不判失败：蓝图没有说明文字不影响放置。
//  - 内容 id 是 <namespace>/<文件名>，与所在包无关，所以跨包引用（车包用 kit 的件）也
//    能落到文件。
//  - 语言键的可达性按“有没有消费方”判：字面量出现在包内非 lang、非 docs 的文件或模组源码
//    里，或能由内容 id 按固定规则拼出。判据取宽，宁可漏报也不误报。

import groovy.io.FileType
import groovy.json.JsonSlurper

def sparkModulesDir = new File(projectDir, 'src/main/resources/spark_modules')

// 去注释：内容包 JSON 是 JSONC。字符串内的 // 不能被当成注释，所以要逐字符扫。
//
// 尾逗号在这里统一剔掉只是为了喂 JsonSlurper——它的宽容度与运行期刚好相反：
// Groovy 容忍对象尾逗号、不容忍数组尾逗号；运行期读内容包走 Spark-Core 的 PackCodec，
// 即 JsonParser.parseString（Gson 宽松模式），它容忍数组尾逗号、拒绝对象尾逗号。
// 真正按运行期口径判对象尾逗号的是下面的 findObjectTrailingComma。
def stripJsonc = { String text ->
    String body = text.startsWith('\uFEFF') ? text.substring(1) : text
    StringBuilder out = new StringBuilder(body.length())
    boolean inString = false
    boolean escaped = false
    int i = 0
    int n = body.length()
    while (i < n) {
        char c = body.charAt(i)
        if (inString) {
            out.append(c)
            if (escaped) {
                escaped = false
            } else if (c == ('\\' as char)) {
                escaped = true
            } else if (c == ('"' as char)) {
                inString = false
            }
            i++
            continue
        }
        if (c == ('"' as char)) {
            inString = true
            out.append(c)
            i++
            continue
        }
        if (c == ('/' as char) && i + 1 < n && body.charAt(i + 1) == ('/' as char)) {
            while (i < n && body.charAt(i) != ('\n' as char)) {
                i++
            }
            continue
        }
        if (c == ('/' as char) && i + 1 < n && body.charAt(i + 1) == ('*' as char)) {
            i += 2
            while (i + 1 < n && !(body.charAt(i) == ('*' as char) && body.charAt(i + 1) == ('/' as char))) {
                i++
            }
            i = Math.min(i + 2, n)
            continue
        }
        out.append(c)
        i++
    }
    out.toString().replaceAll(',(\\s*[}\\]])', '$1')
}

// 对象尾逗号的位置（无则 -1）：Gson 宽松模式读 `{"a":1,}` 会抛
// MalformedJsonException: Expected name，而 JsonSlurper 读它不报错，
// 所以这类错误能过检查、只在进游戏读模板时炸掉整个文件。判据与 Gson 一致：
// 逗号后面（跳过空白与注释）紧跟 `}` 即命中；紧跟 `]` 不算（Gson 接受数组尾逗号）。
def findObjectTrailingComma = { String text ->
    int i = 0
    int n = text.length()
    boolean inString = false
    boolean escaped = false
    while (i < n) {
        char c = text.charAt(i)
        if (inString) {
            if (escaped) {
                escaped = false
            } else if (c == ('\\' as char)) {
                escaped = true
            } else if (c == ('"' as char)) {
                inString = false
            }
            i++
            continue
        }
        if (c == ('"' as char)) {
            inString = true
            i++
            continue
        }
        if (c == ('/' as char) && i + 1 < n && text.charAt(i + 1) == ('/' as char)) {
            while (i < n && text.charAt(i) != ('\n' as char)) {
                i++
            }
            continue
        }
        if (c == ('/' as char) && i + 1 < n && text.charAt(i + 1) == ('*' as char)) {
            i += 2
            while (i + 1 < n && !(text.charAt(i) == ('*' as char) && text.charAt(i + 1) == ('/' as char))) {
                i++
            }
            i = Math.min(i + 2, n)
            continue
        }
        if (c == (',' as char)) {
            int j = i + 1
            while (j < n) {
                char d = text.charAt(j)
                if (d == (' ' as char) || d == ('\n' as char) || d == ('\r' as char) || d == ('\t' as char)) {
                    j++
                    continue
                }
                if (d == ('/' as char) && j + 1 < n && text.charAt(j + 1) == ('/' as char)) {
                    while (j < n && text.charAt(j) != ('\n' as char)) {
                        j++
                    }
                    continue
                }
                if (d == ('/' as char) && j + 1 < n && text.charAt(j + 1) == ('*' as char)) {
                    j += 2
                    while (j + 1 < n && !(text.charAt(j) == ('*' as char) && text.charAt(j + 1) == ('/' as char))) {
                        j++
                    }
                    j = Math.min(j + 2, n)
                    continue
                }
                break
            }
            if (j < n && text.charAt(j) == ('}' as char)) {
                return i
            }
        }
        i++
    }
    return -1
}

// 字符下标 → 1 起的行列，用于把上面扫到的位置报成编辑器能跳的位置
def lineColumnOf = { String text, int index ->
    int line = 1
    int column = 1
    for (int i = 0; i < index && i < text.length(); i++) {
        if (text.charAt(i) == ('\n' as char)) {
            line++
            column = 1
        } else {
            column++
        }
    }
    [line, column]
}

// 闭包自引用需要先声明
def walkStrings
walkStrings = { Object node, Closure onString ->
    if (node instanceof Map) {
        node.values().each { walkStrings(it, onString) }
    } else if (node instanceof List) {
        node.each { walkStrings(it, onString) }
    } else if (node instanceof CharSequence) {
        onString(node.toString())
    }
}

// 收集材质的表现粒子：材质的 particles 段是「表现用途 → 粒子 id」的表（hit_pen、hit_un_pen 等）
def walkMaterialParticles
walkMaterialParticles = { Object node, Closure onMaterialParticle ->
    if (node instanceof Map) {
        node.each { Object key, Object value ->
            if (key == 'particles' && value instanceof Map) {
                value.each { Object use, Object particle ->
                    if (particle != null) {
                        onMaterialParticle(use.toString(), particle.toString())
                    }
                }
            }
            walkMaterialParticles(value, onMaterialParticle)
        }
    } else if (node instanceof List) {
        node.each { walkMaterialParticles(it, onMaterialParticle) }
    }
}

// 收集粒子定义之间的子效果引用：粒子 JSON 的 events 里用 particle_effect 生成另一个粒子效果
def walkChildParticles
walkChildParticles = { Object node, Closure onChildParticle ->
    if (node instanceof Map) {
        node.each { Object key, Object value ->
            if (key == 'particle_effect' && value instanceof Map && value.get('effect') != null) {
                onChildParticle(value.get('effect').toString())
            } else {
                walkChildParticles(value, onChildParticle)
            }
        }
    } else if (node instanceof List) {
        node.each { walkChildParticles(it, onChildParticle) }
    }
}

def readJsonc = { File file ->
    new JsonSlurper().parseText(stripJsonc(file.getText('UTF-8')))
}

// 包目录 → 内容目录（meta.json 的 id 前缀就是 namespace）
def packs = []
if (sparkModulesDir.isDirectory()) {
    sparkModulesDir.eachDir { File packDir ->
        File meta = new File(packDir, 'meta.json')
        if (!meta.isFile()) {
            return
        }
        String packId = (String) readJsonc(meta).get('id')
        String namespace = packId.contains(':') ? packId.substring(0, packId.indexOf(':')) : packId
        File contentDir = new File(packDir, namespace)
        if (contentDir.isDirectory()) {
            packs << [name: packDir.name, namespace: namespace, dir: contentDir]
        }
    }
}
packs.sort { it.name }

tasks.register('checkContent') {
    group = 'content'
    description = '校验装配体 / 载具蓝图与模板对齐，JSON 引用的图标与模型可达，以及语言键的可达性与中英配对'
    doLast {
        def problems = []
        def details = new StringBuilder()
        def pendingTooltips = []

        // 资源索引：内容 id 是 <namespace>/<路径>，与所在包无关，所以所有包合成一份。
        // 跨包引用（车包用 kit 的件、车包用 builtin 的贴图）必须能落到文件。
        Set<String> resourceFiles = new HashSet<>()
        Set<String> geoModels = new HashSet<>()
        Set<String> particleIds = new HashSet<>()
        packs.each { pack ->
            pack.dir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.toPath().any { it.toString() == 'docs' }) {
                    return
                }
                String relative = pack.dir.toPath().relativize(file.toPath()).toString()
                        .replace(File.separatorChar, '/' as char)
                resourceFiles << relative
                if (relative.endsWith('.json')) {
                    String raw = file.getText('UTF-8')
                    int commaAt = findObjectTrailingComma(raw)
                    if (commaAt >= 0) {
                        def (int line, int column) = lineColumnOf(raw, commaAt)
                        problems << pack.name + '/' + relative + ':' + line + ':' + column +
                                '：对象尾逗号（运行期 Gson 读成 Expected name，整个文件读不出来）'
                    }
                }
                if (relative.startsWith('models/') && relative.endsWith('.geo.json')) {
                    // 模型引用写成 `machine_max:k17.geo`，文件名是 `k17.geo.json`：存去掉 .json 的名字
                    geoModels << file.name.substring(0, file.name.length() - '.json'.length())
                }
                if (relative.startsWith('particles/') && relative.endsWith('.particle.json')) {
                    // 粒子 id 是 <namespace>/<文件名去掉 .particle.json>
                    String name = file.name.substring(0, file.name.length() - '.particle.json'.length())
                    particleIds << pack.namespace + ':' + name
                }
            }
        }

        // 模板 / 装配体 / 载具蓝图：id → 定义
        def templates = [:]
        def assemblies = [:]
        def blueprints = [:]
        packs.each { pack ->
            [templates: templates, assemblies: assemblies, blueprints: blueprints].each { String kind, Map bucket ->
                File dir = new File(pack.dir, kind)
                if (!dir.isDirectory()) {
                    return
                }
                dir.eachFileRecurse(FileType.FILES) { File file ->
                    if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                        return
                    }
                    String stem = file.name.substring(0, file.name.length() - '.json'.length())
                    bucket[pack.namespace + ':' + stem] = [pack: pack.name, file: file]
                }
            }
        }

        // 1. 模板 ↔ 装配体 ↔ 载具蓝图
        templates.keySet().sort().each { String id ->
            [assemblies: '装配体', blueprints: '载具蓝图'].each { String kind, String label ->
                def entry = (kind == 'assemblies' ? assemblies : blueprints)[id]
                if (entry == null) {
                    problems << '模板 ' + id + ' 缺' + label + '（' + kind + '/' +
                            id.substring(id.indexOf(':') + 1) + '.json）'
                }
            }
        }
        [assemblies: '装配体', blueprints: '载具蓝图'].each { String kind, String label ->
            Map bucket = (kind == 'assemblies' ? assemblies : blueprints)
            bucket.each { String id, Map entry ->
                Object data
                try {
                    data = readJsonc((File) entry.file)
                } catch (Exception exception) {
                    problems << entry.pack + '/' + kind + '/' + ((File) entry.file).name +
                            '：解析失败（' + exception.message + '）'
                    return
                }
                Object declared = data instanceof Map ? data.get('template') : null
                String template = declared == null ? null : declared.toString()
                if (template == null) {
                    problems << entry.pack + '/' + kind + '/' + ((File) entry.file).name + '：缺 template 字段'
                } else if (!templates.containsKey(template)) {
                    problems << entry.pack + '/' + kind + '/' + ((File) entry.file).name +
                            '：template ' + template + ' 找不到对应模板'
                    details.append('    引用  ').append(entry.pack).append('/').append(kind).append('/')
                            .append(((File) entry.file).name).append(' → ').append(template).append('\n')
                } else if (template != id) {
                    problems << entry.pack + '/' + kind + '/' + ((File) entry.file).name +
                            '：id ' + id + ' 与 template ' + template + ' 不同名，创造栏按模板 id 取的正是同名条目'
                }
            }
        }

        // 2. JSON 里的资源引用
        int referenceCount = 0
        int particleReferenceCount = 0
        int childParticleCount = 0
        // 贴图 / 模型只校验内置与模板命名空间，外部命名空间留给对应 mod 自己管
        def referencePattern = ~/^(machine_max|namespace):([A-Za-z0-9_.\/-]+\.(png|geo))$/
        // 说明页面按 AUI 文档根解析：namespace:tooltips/x.html → <包>/<namespace>/documents/tooltips/x.html
        def tooltipPattern = ~/^([a-z0-9_.-]+):([A-Za-z0-9_.\/-]+\.html)$/
        packs.each { pack ->
            pack.dir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                if (file.toPath().any { it.toString() == 'docs' }) {
                    return
                }
                Object data
                try {
                    data = readJsonc(file)
                } catch (Exception exception) {
                    return
                }
                String label = pack.name + '/' + pack.namespace + '/' +
                        pack.dir.toPath().relativize(file.toPath()).toString()
                                .replace(File.separatorChar, '/' as char)
                // 3. 材质的表现粒子（命中火花等）
                walkMaterialParticles(data) { String use, String value ->
                    particleReferenceCount++
                    if (!particleIds.contains(value)) {
                        problems << label + '：particles.' + use + ' ' + value +
                                ' 找不到粒子定义（particles/<名>.particle.json）'
                        details.append('    缺粒子  ').append(label).append(' → ')
                                .append('particles.').append(use).append(' = ').append(value).append('\n')
                    }
                }
                // 4. 粒子定义之间的事件引用（events 里的 particle_effect）
                if (file.name.endsWith('.particle.json')) {
                    walkChildParticles(data) { String value ->
                        childParticleCount++
                        if (!particleIds.contains(value)) {
                            problems << label + '：events 引用的子效果 ' + value +
                                    ' 找不到粒子定义（particles/<名>.particle.json）'
                            details.append('    缺粒子  ').append(label).append(' → ')
                                    .append('particle_effect.effect = ').append(value).append('\n')
                        }
                    }
                }
                walkStrings(data) { String value ->
                    def tooltipMatcher = tooltipPattern.matcher(value)
                    if (tooltipMatcher.matches()) {
                        String namespace = tooltipMatcher.group(1)
                        String relative = tooltipMatcher.group(2)
                        boolean reachable = new File(pack.dir, 'documents/' + relative).isFile() ||
                                (sparkModulesDir.listFiles() ?: new File[0]).any {
                                    new File(it, namespace + '/documents/' + relative).isFile()
                                }
                        if (!reachable) {
                            pendingTooltips << label
                            details.append('    缺页面  ').append(label).append(' → ')
                                    .append(value).append('\n')
                        }
                        return
                    }
                    def matcher = referencePattern.matcher(value)
                    if (!matcher.matches()) {
                        return
                    }
                    referenceCount++
                    String namespace = matcher.group(1)
                    String relative = matcher.group(2)
                    String extension = matcher.group(3)
                    boolean reachable = extension == 'png'
                            ? resourceFiles.contains(relative)
                            : geoModels.contains(relative.substring(relative.lastIndexOf('/') + 1))
                    if (!reachable) {
                        problems << label + '：引用 ' + namespace + ':' + relative + ' 找不到文件'
                        details.append('    缺失  ').append(label).append(' → ')
                                .append(namespace).append(':').append(relative).append('\n')
                    }
                }
            }
        }

        // 5. 语言键可达 + 中英键集一致
        //
        // 一条键“可达”指下列任一路径能取到它：
        //   a. 字面量出现在某个包的 lang/ 与 docs/ 之外的文件里（模板的 part.* 条目、控制组 /
        //      连接点 / 子系统名字、HTML 的 <translation>、配方里的 research.*.desc …），
        //      或出现在模组源码 src/main/{java,kotlin} 里；
        //   b. 由内容 id 按固定规则拼出：部件 / 装配体 / 蓝图 / 投射物的 <ns>.<文件名>，
        //      型号的 <ns>.fitting.<文件名>，研发的 <ns>.research.<文件名>；以及任何
        //      <ns>:<路径> 资源位置对应的两种写法（<ns>.<路径>、<ns>.<路径去掉斜杠>），
        //      标签 machine_max:series/ae86 与研发分组 type59:type59_turret 都走这条。
        def resourceIdPattern = ~/^[a-z0-9_.-]+:[a-z0-9_.\/-]+$/
        def languageKeys = [:] as Map
        packs.each { pack ->
            File langDir = new File(pack.dir, 'lang')
            if (!langDir.isDirectory()) {
                return
            }
            def perFile = [:] as Map
            langDir.eachFile(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                Object data = readJsonc(file)
                perFile[file.name] = data instanceof Map ? data.keySet().collect { it.toString() } as Set : [] as Set
            }
            if (perFile) {
                languageKeys[pack.name] = perFile
            }
        }

        StringBuilder corpus = new StringBuilder()
        def appendTextFile = { File file ->
            String name = file.name.toLowerCase(Locale.ROOT)
            if (!(name.endsWith('.json') || name.endsWith('.html') || name.endsWith('.css') ||
                    name.endsWith('.js') || name.endsWith('.svg') || name.endsWith('.md') ||
                    name.endsWith('.txt'))) {
                return
            }
            corpus.append(file.getText('UTF-8')).append('\n' as char)
        }
        packs.each { pack ->
            pack.dir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.toPath().any { it.toString() == 'docs' || it.toString() == 'lang' }) {
                    return
                }
                appendTextFile(file)
            }
        }
        ['java', 'kotlin'].each { String sourceSet ->
            File sourceDir = new File(projectDir, 'src/main/' + sourceSet)
            if (!sourceDir.isDirectory()) {
                return
            }
            sourceDir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.name.toLowerCase(Locale.ROOT).endsWith('.' + sourceSet)) {
                    corpus.append(file.getText('UTF-8')).append('\n' as char)
                }
            }
        }

        // 键名只由 ASCII 字母、数字、点、下划线、斜杠组成，所以在整段语料上按“连续记号”
        // 取词即可。取整记号而不是子串匹配：短键不会因为长键里含有它就被误判为可达。
        Set<String> literalTokens = new HashSet<>()
        (corpus.toString() =~ /[A-Za-z0-9_][A-Za-z0-9_.\/#-]*/).each { literalTokens << it.toString() }

        Set<String> derivedKeys = new HashSet<>()
        packs.each { pack ->
            String namespace = pack.namespace
            ['parts', 'assemblies', 'blueprints', 'projectiles'].each { String kind ->
                File dir = new File(pack.dir, kind)
                if (!dir.isDirectory()) {
                    return
                }
                dir.eachFileRecurse(FileType.FILES) { File file ->
                    if (file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                        derivedKeys << namespace + '.' + file.name.substring(0, file.name.length() - 5)
                    }
                }
            }
            ['fittings': 'fitting', 'recipe/research': 'research'].each { String kind, String prefix ->
                File dir = new File(pack.dir, kind)
                if (!dir.isDirectory()) {
                    return
                }
                dir.eachFileRecurse(FileType.FILES) { File file ->
                    if (file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                        derivedKeys << namespace + '.' + prefix + '.' +
                                file.name.substring(0, file.name.length() - 5)
                    }
                }
            }
            pack.dir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.toPath().any { it.toString() == 'docs' || it.toString() == 'lang' }) {
                    return
                }
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                Object data
                try {
                    data = readJsonc(file)
                } catch (Exception ignored) {
                    return
                }
                walkStrings(data) { String value ->
                    if (!resourceIdPattern.matcher(value).matches()) {
                        return
                    }
                    int colon = value.indexOf(':')
                    String idNamespace = value.substring(0, colon)
                    String idPath = value.substring(colon + 1)
                    derivedKeys << idNamespace + '.' + idPath
                    derivedKeys << idNamespace + '.' + idPath.replace('/' as char, '.' as char)
                }
            }
        }

        int languageKeyCount = 0
        languageKeys.sort { it.key }.each { String packName, Map perFile ->
            perFile.sort { it.key }.each { String fileName, Set keys ->
                String label = packName + '/lang/' + fileName
                keys.each { String key ->
                    languageKeyCount++
                    if (literalTokens.contains(key) || derivedKeys.contains(key)) {
                        return
                    }
                    problems << label + '：语言键 ' + key + ' 没有任何消费方' +
                            '（包内没有引用它的 JSON / HTML，模组源码不取该键，也拼不出这个 id）'
                }
            }
            Set zh = perFile['zh_cn.json']
            Set en = perFile['en_us.json']
            if (zh == null || en == null) {
                return
            }
            (zh - en).sort().each { problems << packName + '：语言键 ' + it + ' 只有中文，英文缺' }
            (en - zh).sort().each { problems << packName + '：语言键 ' + it + ' 只有英文，中文缺' }
        }

        packs.each { pack ->
            int ownTemplates = templates.values().count { it.pack == pack.name }
            int ownAssemblies = assemblies.values().count { it.pack == pack.name }
            int ownBlueprints = blueprints.values().count { it.pack == pack.name }
            logger.quiet('  ok  ' + pack.name + '/' + pack.namespace + '：模板 ' + ownTemplates +
                    '，装配体 ' + ownAssemblies + '，载具蓝图 ' + ownBlueprints)
        }
        if (pendingTooltips) {
            logger.quiet('  提示 ' + pendingTooltips.size() + ' 处 tooltip 引用的 html 还没有文件' +
                    '（缺了只是蓝图没有说明文字，不影响放置）：')
            details.toString().readLines()
                    .findAll { it.startsWith('    缺页面') }
                    .each { logger.quiet(it) }
        }

        if (problems) {
            def text = details.toString().readLines().join('\n')
            throw new GradleException('内容包引用检查未通过：\n  ' + problems.join('\n  ') +
                    (text ? '\n' + text : ''))
        }
        logger.quiet('内容包引用检查通过（' + templates.size() + ' 份模板 / ' + assemblies.size() +
                ' 份装配体 / ' + blueprints.size() + ' 份蓝图，' + referenceCount + ' 处资源引用，' +
                particleReferenceCount + ' 处材质粒子引用，' + childParticleCount + ' 处子效果引用，' +
                languageKeyCount + ' 条语言键）。')
    }
}

if (tasks.findByName('check') != null) {
    tasks.named('check').configure { dependsOn tasks.named('checkContent') }
}
