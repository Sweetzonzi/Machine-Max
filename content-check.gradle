// 内容包引用检查。
//
//   ./gradlew checkContent    只读校验（check 依赖它，CI 的 build 因此也会跑）
//
// 下列问题都只能靠读 JSON 发现，编译期不会报：
//
//  1. 装配体 / 载具蓝图与模板对齐。创造栏的两个页签按模板 id 生成物品，物品里存的是
//     模板 id，读取时再拿它去 assemblies/、blueprints/ 查同名条目。文件名与模板不同名、
//     template 字段多带了后缀、或者整条缺失，物品都在但放不出车。
//  2. JSON 里引用的资源可达。图标少写一层目录、图标改名后引用没跟上、模型改名漏同步，
//     在游戏里只表现为紫黑格子或空模型，不报错。
//  3. 材质的表现粒子可达。材质 particles 段里的 id（hit_pen / hit_un_pen …）写错一个字母，
//     游戏里只是打中装甲不出火花，既不报错也不刷日志（客户端解析不到定义时静默跳过）。
//  4. 粒子定义之间的子效果引用可达。粒子 JSON 的 events 里用 particle_effect 生成另一个
//     效果时，效果 id 拼错只会让子效果不出现（如只剩火花、没有闪光与烟尘），同样没有日志。
//  5. 座位控制组预设可达。座位安装块的 control_group_preset 指向 control_groups/<名>.json，
//     拼错一个字母时 SeatSubsystem 构造器打一条 WARN 就按空控制组继续——座位仍在，乘员按
//     什么键都没有反应，面板里也列不出任何组。
//  6. 语言键可达、中英成对且中文值真的写了中文。零件改名后残留的旧键、写错前缀的键
//     （fitting.<ns>.<id> 与 FittingType.nameKey 的 <ns>.fitting.<id> 相反）在游戏里只表现
//     为屏幕上一段原始键名；只有一边语言有的键则让另一边显示原始键名；而键集齐全、中文值
//     却是英文时，中文客户端会直接显示英文。三者都不报错。型号名与弹种 / 弹链标签刻意保留
//     英文，不计入缺译。
//  7. 控制组预设的越级量表只写自己会发出的频道。priorities 的键拼错时，这一条频道就按
//     越级量 0 处理——表现是"超控没反应"，既不报错也不刷日志。解码期只能校验值的范围
//     （负值被 Codec.intRange 拒绝），看不到基础组，所以键只能在这里对。
//  8. 单变体内「子系统 / 交互区 / 连接点」名字唯一且不使用信号保留地址。三类名字共用一套
//     命名空间，按名解析的作用域是单个 Part；重名时运行期只命中其中一个，解码期
//     （VariantAttr#validateUniqueNames）抛 PackContentException 让该部件类型双端都不出现。
//     这里把同一判据提前到构建期，作者不必进游戏才发现自己的内容被整条剔除。
//  9. 履带临时配方与型号对齐。履带物品只有一个 machine_max:track，型号由合成结果的
//     result.components 给出；型号 id 写错时配方照常加载，游戏里只是物品铺不上、模型回落
//     默认型号。反过来漏了配方则型号在生存里拿不到。
// 10. 文档页面的样式表可达。documents/ 下的 <link rel="stylesheet"> 与 CSS 的 @import 按
//     AUI 的 Loader.resolve 解析（以 / 开头是绝对逻辑路径，否则相对页面所在目录，折叠 . 与
//     ..），结果必须落在某个内容包的 documents/ 里。解析不到时页面照常打开，只是整页丢掉
//     样式——既不报错也不刷日志，只有肉眼看得出“文字样式不对”。
// 11. 交互区的目标只能是 local / global 动画事件、变体内子系统，或变体内连接点（跨零件用）。交互区只发不收：
//     local 按频道名直接向所属 Part 投递一次动画事件，global 交给装配体广播给全载具部件；其他目标按声明序
//     直接询问解析到的子系统，不经过信号槽。目标写错名字或写成另一个交互区时，解析结果为空，
//     这个交互区会静默地完全不激活——提示不亮、射线选不中、进游戏只表现为“这扇门没反应”。
//     同一条频道不能兼指 local 与 global（一次点击会把同一个事件投两遍）。目标写成连接点名的频道要跨零件，
//     事件由对侧连接点的两张表决定去向：本节按模板的 connections 核对对侧有没有把到达频道写进
//     signal_targets，并反查「写进连接点、却没有任何模板配对」的线——两种都表现为点击无反应、日志全无。
//     事件落在总线（local / global）上时，到达频道必须对得上某份动画控制器里的 event.<名>：零件状态机按
//     到达频道切动画，名字对不上时这条线静默无效。同一个连接点上，多个交互区送来的频道必须互不相同：
//     一个连接点的信号表是「到达频道 → 目标」的一张映射，两条线共用一个名字时对侧合流、分不出是谁点的。
//     多个交互区共用一个连接点（多个交互区 → 一个中间件 → 对侧按名分发，如 AE86 车壳→车架）因此要给每个
//     交互区各自的频道名；这条只拦重名，不拦共用连接点。
// 12. 五类名字键（子零件 / 子系统 / 连接点 / 交互区 / 控制组）的构形与译文。名字就是完整翻译键，缺一条界面上就原样显示 connector.machine_max.axis；语言表按命名空间合并，所以 machine_max 命名空间的名字必须写进 builtin 那一份，车包私有命名空间的写自己那份。名字还要恰好三段：带点的名字（interact.machine_max.golden.seat）能翻得出来，但对不上「类别.命名空间.名字」这套规则，拼写检查与词表都会漏掉它。
// 13. 动画与模板里的名字引用。动画的 MoLang 用完整名字键查本部件，模板用完整名字键把两个零件的
//     连接点配成一条线；名字改过而引用没跟随时查不到东西，表现是悬架不跟动、爆反挡板不缩、装配体
//     少一组约束，全都没有日志。动画按引用它的变体们的名字并集核对，没有变体引用的动画（HUD）不查。
// 14. 转向轮布局。车控拿「非转向轮的平均位置」当转向中心算阿克曼转角（全是转向轮时改用
//     全部轮的平均位置），所以转向轮全挤在同一根轴上时纵向距离恒为 0、转角恒为 0：车能开能刹，
//     打方向没有反应。运行时的兜底是改用车控宿主子零件的质心当转向中心并打一条 WARN，代价是
//     转弯半径翻倍；构建期仍按错误拦，因为第一方内容应当把后轮也接上。判定用连接点的 yr 行程
//     分转向轮与非转向轮，再用模型的定位器量出这些轮子的纵向跨度。
// 15. 音效事件引用可达。内容包里的音效一律写成 { "sound_id": <事件 id>, "range": <格> }，
//     事件 id 必须在某个内容包的 sounds/sounds.json 或 mod 自己的 assets/<命名空间>/sounds.json
//     里有同名键（前者由 Spark 的 SoundModule 合并后注入客户端资源包，键就是原版 sounds.json
//     的事件名，事件 id 为 <命名空间>:<键>）。引用到没注册的事件时客户端解析不到音频缓冲，
//     那一处静默无声——既不报错也不刷日志。只核对内容命名空间里的事件，minecraft 与外部 mod
//     的事件无法离线核对，原样跳过。基础名没注册、只有 <id>_interior 时有注册是合法配置：
//     车内听者由播放器换成该变体，车外没有录音因此静音（弹壳音就是只有车内录音）。
// 16. 视点发现表（座位与武器控制器的 camera_discovery_targets）的取值域与频道。这张表决定
//     座位 / 火控能发现哪些视点：具名目标不走接收侧接受频道，名字写错或指向别的类型时发现
//     结果为空、频道写错也照样命中；local / global 与连接点名要过视点的 discovery_inputs，
//     写错时永远命中不了。两种情况都只表现为"少一个视角"，没有日志。反方向同样查：一台视点
//     在模板拼出的装配体里既没有被具名引用、也没有接受任何广播频道时，它永远进不了候选。
// 17. 非根子零件的内部连接点。同一 Part 内非 internal 的连接点只在运行时按需连接，构造期
//     不会预连；一个只靠它连到别处的子零件在构造后没有任何关节约束，入世即成为自由刚体
//     掉落（同装配体的碰撞过滤让它直接穿过车体）。判定按质量最大的子零件当根；可开件用
//     internal 铰链 + 非 internal 锁扣，可分离件自成 Part。
//
// 扫描前先按运行期口径做一遍语法体检：`{"a":1,}` 这类对象尾逗号 JsonSlurper 读得进去，
// 而运行期读内容包的 Gson（JsonParser.parseString，宽松模式）会抛 Expected name，
// 结果是整份文件读不出来——模板读不出来就放不出车，配件读不出来则那个子系统整条消失。
//
// 口径：
//  - 只扫各包的 <namespace>/ 目录，跳过 docs/（schema 副本由 checkSchemas 管）。
//  - `.png` 按内容目录内的相对路径精确匹配；`.geo` 按文件名在 models/ 下递归找（各包
//    的 models 子目录布局不一致，有 models/part、models/fitting，也有平铺的）。
//  - `.html` 按 AUI 文档根解析（namespace:tooltips/x.html → <namespace>/documents/tooltips/x.html），
//    缺页面只做汇总提示、不判失败：蓝图没有说明文字不影响放置。
//  - 内容 id 是 <namespace>/<文件名>，与所在包无关，所以跨包引用（车包用 kit 的件）也
//    能落到文件。控制组预设的 id 取 control_groups/ 下的文件名（ControlGroupModule 只用
//    文件名拼 id，不看子目录），索引因此按文件名建。
//  - 座位控制组预设 machine_max:empty 是“不挂预设”的保留值（AbstractSubsystemAttr
//    .NO_CONTROL_GROUP_PRESET），从不落地成文件，引用它不算缺失。
//  - 语言键的可达性按“有没有消费方”判：字面量出现在包内非 lang、非 docs 的文件或模组源码
//    里，或能由内容 id 按固定规则拼出。判据取宽，宁可漏报也不误报。
//  - 原版合成配方落在 data/machine_max/recipe/ 下，按严格 JSON 读：读数据包时 GsonHelper
//    不启用宽松模式，注释与尾逗号都会让整份文件被跳过。只查 recipe/fittings/ 一层，与
//    履带临时配方的落点一致。

import groovy.io.FileType
import groovy.json.JsonSlurper

def contentProjectDir = layout.projectDirectory.asFile
def sparkModulesDir = new File(contentProjectDir, 'src/main/resources/spark_modules')

// 去注释：内容包 JSON 是 JSONC。字符串内的 // 不能被当成注释，所以要逐字符扫。
//
// 尾逗号在这里统一剔掉只是为了喂 JsonSlurper——它的宽容度与运行期刚好相反：
// Groovy 容忍对象尾逗号、不容忍数组尾逗号；运行期读内容包走 Spark-Core 的 PackCodec，
// 即 JsonParser.parseString（Gson 宽松模式），它容忍数组尾逗号、拒绝对象尾逗号。
// 真正按运行期口径判对象尾逗号的是下面的 findObjectTrailingComma。
def stripJsonc = { String text ->
    String body = text.startsWith('\uFEFF') ? text.substring(1) : text
    StringBuilder out = new StringBuilder(body.length())
    boolean inString = false
    boolean escaped = false
    int i = 0
    int n = body.length()
    while (i < n) {
        char c = body.charAt(i)
        if (inString) {
            out.append(c)
            if (escaped) {
                escaped = false
            } else if (c == ('\\' as char)) {
                escaped = true
            } else if (c == ('"' as char)) {
                inString = false
            }
            i++
            continue
        }
        if (c == ('"' as char)) {
            inString = true
            out.append(c)
            i++
            continue
        }
        if (c == ('/' as char) && i + 1 < n && body.charAt(i + 1) == ('/' as char)) {
            while (i < n && body.charAt(i) != ('\n' as char)) {
                i++
            }
            continue
        }
        if (c == ('/' as char) && i + 1 < n && body.charAt(i + 1) == ('*' as char)) {
            i += 2
            while (i + 1 < n && !(body.charAt(i) == ('*' as char) && body.charAt(i + 1) == ('/' as char))) {
                i++
            }
            i = Math.min(i + 2, n)
            continue
        }
        out.append(c)
        i++
    }
    out.toString().replaceAll(',(\\s*[}\\]])', '$1')
}

// 对象尾逗号的位置（无则 -1）：Gson 宽松模式读 `{"a":1,}` 会抛
// MalformedJsonException: Expected name，而 JsonSlurper 读它不报错，
// 所以这类错误能过检查、只在进游戏读模板时炸掉整个文件。判据与 Gson 一致：
// 逗号后面（跳过空白与注释）紧跟 `}` 即命中；紧跟 `]` 不算（Gson 接受数组尾逗号）。
def findObjectTrailingComma = { String text ->
    int i = 0
    int n = text.length()
    boolean inString = false
    boolean escaped = false
    while (i < n) {
        char c = text.charAt(i)
        if (inString) {
            if (escaped) {
                escaped = false
            } else if (c == ('\\' as char)) {
                escaped = true
            } else if (c == ('"' as char)) {
                inString = false
            }
            i++
            continue
        }
        if (c == ('"' as char)) {
            inString = true
            i++
            continue
        }
        if (c == ('/' as char) && i + 1 < n && text.charAt(i + 1) == ('/' as char)) {
            while (i < n && text.charAt(i) != ('\n' as char)) {
                i++
            }
            continue
        }
        if (c == ('/' as char) && i + 1 < n && text.charAt(i + 1) == ('*' as char)) {
            i += 2
            while (i + 1 < n && !(text.charAt(i) == ('*' as char) && text.charAt(i + 1) == ('/' as char))) {
                i++
            }
            i = Math.min(i + 2, n)
            continue
        }
        if (c == (',' as char)) {
            int j = i + 1
            while (j < n) {
                char d = text.charAt(j)
                if (d == (' ' as char) || d == ('\n' as char) || d == ('\r' as char) || d == ('\t' as char)) {
                    j++
                    continue
                }
                if (d == ('/' as char) && j + 1 < n && text.charAt(j + 1) == ('/' as char)) {
                    while (j < n && text.charAt(j) != ('\n' as char)) {
                        j++
                    }
                    continue
                }
                if (d == ('/' as char) && j + 1 < n && text.charAt(j + 1) == ('*' as char)) {
                    j += 2
                    while (j + 1 < n && !(text.charAt(j) == ('*' as char) && text.charAt(j + 1) == ('/' as char))) {
                        j++
                    }
                    j = Math.min(j + 2, n)
                    continue
                }
                break
            }
            if (j < n && text.charAt(j) == ('}' as char)) {
                return i
            }
        }
        i++
    }
    return -1
}

// 字符下标 → 1 起的行列，用于把上面扫到的位置报成编辑器能跳的位置
// 配置缓存会序列化闭包的参数类型；Gradle 8.8 / 8.9 无法还原 primitive int 的 Class。
def lineColumnOf = { String text, Integer index ->
    int line = 1
    int column = 1
    for (int i = 0; i < index && i < text.length(); i++) {
        if (text.charAt(i) == ('\n' as char)) {
            line++
            column = 1
        } else {
            column++
        }
    }
    [line, column]
}

// 闭包自引用需要先声明
def walkStrings
walkStrings = { Object node, Closure onString ->
    if (node instanceof Map) {
        node.values().each { walkStrings(it, onString) }
    } else if (node instanceof List) {
        node.each { walkStrings(it, onString) }
    } else if (node instanceof CharSequence) {
        onString(node.toString())
    }
}

// 名字键（五类）的完整形态：<类别>.<命名空间>.<名字>。前面的断言排除
// `machine_max:subsystem.engine.i4_1000` 这类 id —— 音效 id 也占用 subsystem. 前缀空间
// （见 sounds/*.json 与 subtitles），去掉前缀后与名字键同形。
def nameKeyToken = ~/(?<![A-Za-z0-9_:.\/-])(sub_part|subsystem|connector|interact|controlGroup)\.[a-z0-9_]+\.[a-z0-9_]+\b/
def collectNameRefs
collectNameRefs = { Object node, Collection<String> out ->
    if (node instanceof Map) {
        ((Map) node).values().each { collectNameRefs(it, out) }
    } else if (node instanceof Collection) {
        ((Collection) node).each { collectNameRefs(it, out) }
    } else if (node instanceof CharSequence) {
        def matcher = nameKeyToken.matcher(node.toString())
        while (matcher.find()) {
            out << matcher.group(0)
        }
    }
}

// 收集材质的表现粒子：材质的 particles 段是「表现用途 → 粒子 id」的表（hit_pen、hit_un_pen 等）
def walkMaterialParticles
walkMaterialParticles = { Object node, Closure onMaterialParticle ->
    if (node instanceof Map) {
        node.each { Object key, Object value ->
            if (key == 'particles' && value instanceof Map) {
                value.each { Object use, Object particle ->
                    if (particle != null) {
                        onMaterialParticle(use.toString(), particle.toString())
                    }
                }
            }
            walkMaterialParticles(value, onMaterialParticle)
        }
    } else if (node instanceof List) {
        node.each { walkMaterialParticles(it, onMaterialParticle) }
    }
}

// 收集粒子定义之间的子效果引用：粒子 JSON 的 events 里用 particle_effect 生成另一个粒子效果
def walkChildParticles
walkChildParticles = { Object node, Closure onChildParticle ->
    if (node instanceof Map) {
        node.each { Object key, Object value ->
            if (key == 'particle_effect' && value instanceof Map && value.get('effect') != null) {
                onChildParticle(value.get('effect').toString())
            } else {
                walkChildParticles(value, onChildParticle)
            }
        }
    } else if (node instanceof List) {
        node.each { walkChildParticles(it, onChildParticle) }
    }
}

// 收集座位安装块的控制组预设引用：control_group_preset 由 SeatSubsystemAttr 的 codec 声明，
// 是唯一读取该字段的地方，所以按字段名扫即可、不必先认 type。键名取外层映射的键（即子系统
// 名，如 subsystem.machine_max.commander_seat），报错时直接指得到 JSON 里的那一行。
def walkControlGroupPresets
walkControlGroupPresets = { Object node, Closure onPreset ->
    if (node instanceof Map) {
        node.each { Object key, Object value ->
            if (value instanceof Map && value.get('control_group_preset') != null) {
                onPreset(key.toString(), value.get('control_group_preset').toString())
            }
            walkControlGroupPresets(value, onPreset)
        }
    } else if (node instanceof List) {
        node.each { walkControlGroupPresets(it, onPreset) }
    }
}

// 收集音效事件引用：音效字段统一是 { "sound_id": ..., "range": ... }（SoundEvent.DIRECT_CODEC
// 的形态），所以按键名扫即可，不必先认外层是哪个属性类的字段。
def walkSoundRefs
walkSoundRefs = { Object node, Closure onSoundRef ->
    if (node instanceof Map) {
        node.each { Object key, Object value ->
            if (key == 'sound_id' && value != null) {
                onSoundRef(value.toString())
            } else {
                walkSoundRefs(value, onSoundRef)
            }
        }
    } else if (node instanceof Collection) {
        ((Collection) node).each { walkSoundRefs(it, onSoundRef) }
    }
}

def readJsonc = { File file ->
    new JsonSlurper().parseText(stripJsonc(file.getText('UTF-8')))
}

// 控制组预设里一组会发出的频道：五张输出目标表的键。按键绑定与 GUI 动作投递的是裸值，
// 出口处不带越级量，因此不算在越级量表的可选键里。
def presetChannels = { Object group ->
    Set<String> channels = new LinkedHashSet<>()
    if (group instanceof Map) {
        ['move_targets', 'view_targets', 'regular_targets', 'main_weapon_targets',
         'secondary_weapon_targets'].each { String key ->
            Object targets = ((Map) group).get(key)
            if (targets instanceof Map) {
                targets.keySet().each { channels.add(it.toString()) }
            }
        }
    }
    channels
}

// 包目录 → 内容目录。包 id 只是包的身份，与内容命名空间无关：包内第一层子目录各自是一个
// 命名空间（Spark 的 ReadablePathType.readAsPackage 就是按「第一段路径」分组的），
// 所以同一个包可以同时提供多个命名空间，和原版资源包 / 数据包一样；反过来，多个包也可以
// 共用同一个命名空间（builtin 与各国 kit 共用 machine_max）。
// 这里为每个 (包, 命名空间) 记一条，后面的检查全部按命名空间目录展开。
def packs = []
if (sparkModulesDir.isDirectory()) {
    sparkModulesDir.eachDir { File packDir ->
        File meta = new File(packDir, 'meta.json')
        if (!meta.isFile()) {
            return
        }
        packDir.eachDir { File contentDir ->
            packs << [name: packDir.name, namespace: contentDir.name, dir: contentDir]
        }
    }
}
packs.sort { [it.name, it.namespace] }

tasks.register('checkContent') {
    group = 'content'
    description = '校验装配体 / 载具蓝图与模板对齐，资源引用、座位瞄准偏置与俯仰范围、信号与视点接线、语言键、转向轮布局及履带临时配方'
    doLast {
        def problems = []
        def details = new StringBuilder()
        def pendingTooltips = []

        // 资源索引：内容 id 是 <namespace>/<路径>，与所在包无关，所以所有包合成一份。
        // 跨包引用（车包用 kit 的件、车包用 builtin 的贴图）必须能落到文件。
        Set<String> resourceFiles = new HashSet<>()
        Set<String> geoModels = new HashSet<>()
        Set<String> particleIds = new HashSet<>()
        // 动画集 / 控制器集的集合 id 是 <命名空间>:<type>/<集合名>：集合由目录决定，与文件名无关，
        // 同一个集合可以含多个文件。变体的显式 animations / controllers 按同一口径核对。
        Set<String> animationSets = new HashSet<>()
        Set<String> controllerSets = new HashSet<>()
        // 内容 id 的位置写法（<命名空间>:<路径>）转成集合 id（<命名空间>:<type>/<路径>）。
        // 省略命名空间时与 ResourceLocation 一样按 minecraft 补齐。
        def contentSetId = { String reference, String type ->
            int colon = reference.indexOf(':')
            String namespace = colon >= 0 ? reference.substring(0, colon) : 'minecraft'
            String path = colon >= 0 ? reference.substring(colon + 1) : reference
            namespace + ':' + type + '/' + path
        }
        packs.each { pack ->
            pack.dir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.toPath().any { it.toString() == 'docs' }) {
                    return
                }
                String relative = pack.dir.toPath().relativize(file.toPath()).toString()
                        .replace(File.separatorChar, '/' as char)
                resourceFiles << relative
                if (relative.endsWith('.json')) {
                    String raw = file.getText('UTF-8')
                    int commaAt = findObjectTrailingComma(raw)
                    if (commaAt >= 0) {
                        def (int line, int column) = lineColumnOf(raw, commaAt)
                        problems << pack.name + '/' + relative + ':' + line + ':' + column +
                                '：对象尾逗号（运行期 Gson 读成 Expected name，整个文件读不出来）'
                    }
                }
                if (relative.startsWith('models/') && relative.endsWith('.geo.json')) {
                    // 模型引用写成 `machine_max:k17.geo`，文件名是 `k17.geo.json`：存去掉 .json 的名字
                    geoModels << file.name.substring(0, file.name.length() - '.json'.length())
                }
                if (relative.startsWith('particles/') && relative.endsWith('.particle.json')) {
                    // 粒子 id 是 <namespace>/<文件名去掉 .particle.json>
                    String name = file.name.substring(0, file.name.length() - '.particle.json'.length())
                    particleIds << pack.namespace + ':' + name
                }
                if (relative.endsWith('.json')) {
                    List<String> segments = relative.split('/') as List<String>
                    // animations/<type>/<set>/... 与 controllers/<type>/<set>/...：集合取前两段，
                    // 与加载器「只用首两段」的口径一致。
                    if (segments.size() >= 4 && segments[0] == 'animations') {
                        animationSets << pack.namespace + ':' + segments[1] + '/' + segments[2]
                    } else if (segments.size() >= 4 && segments[0] == 'controllers') {
                        controllerSets << pack.namespace + ':' + segments[1] + '/' + segments[2]
                    }
                }
            }
        }

        // 动画事件索引：控制器集里写成 `event.<名>` 的字符串就是零件状态机能接的一次性事件名。
        // 交互区的事件线经总线到达零件后，零件状态机按「到达频道 = 事件名」切开合动画；名字对不上时
        // 这一条线静默无效（点击没反应、日志里没有痕迹），所以两处事件线落点都要拿它核对：
        // 交互区直接写 local / global 的一档，以及跨零件时对侧连接点把频道落在 local / global 的一档。
        Set<String> animationEvents = new LinkedHashSet<>()
        def collectAnimationEvents = { Object root ->
            Deque<Object> stack = new ArrayDeque<>()
            stack.push(root)
            while (!stack.isEmpty()) {
                Object node = stack.pop()
                if (node instanceof Map) {
                    ((Map) node).values().each { if (it != null) stack.push(it) }
                } else if (node instanceof List) {
                    ((List) node).each { if (it != null) stack.push(it) }
                } else if (node instanceof CharSequence) {
                    String text = node.toString()
                    if (text.startsWith('event.') && text.length() > 'event.'.length()) {
                        animationEvents << text.substring('event.'.length())
                    }
                }
            }
        }
        packs.each { pack ->
            File controllersDir = new File(pack.dir, 'controllers')
            if (!controllersDir.isDirectory()) {
                return
            }
            controllersDir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    collectAnimationEvents(readJsonc(file))
                }
            }
        }

        // 音效事件索引：内容包的 sounds.json 由 Spark 的 SoundModule 合并后注入客户端资源包，
        // 键就是原版 sounds.json 的事件名，事件 id 为 <命名空间>:<键>。mod 自己的
        // assets/<命名空间>/sounds.json 走同一条解析，一并并进来；命名空间集合取这两处的并集，
        // 用来区分"内容包自己的事件"与"minecraft / 外部 mod 的事件"。
        Set<String> soundEvents = new LinkedHashSet<>()
        Set<String> soundNamespaces = new LinkedHashSet<>()
        packs.each { pack ->
            soundNamespaces << pack.namespace
            pack.dir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.name != 'sounds.json') {
                    return
                }
                if (file.toPath().any { it.toString() == 'docs' }) {
                    return
                }
                readJsonc(file).keySet().each { soundEvents << pack.namespace + ':' + it }
            }
        }
        File soundAssetsDir = new File(contentProjectDir, 'src/main/resources/assets')
        if (soundAssetsDir.isDirectory()) {
            soundAssetsDir.eachDir { File namespaceDir ->
                File soundsFile = new File(namespaceDir, 'sounds.json')
                if (!soundsFile.isFile()) {
                    return
                }
                soundNamespaces << namespaceDir.name
                readJsonc(soundsFile).keySet().each { soundEvents << namespaceDir.name + ':' + it }
            }
        }

        // 控制组预设索引：id → 所在包。id 是 ControlGroupModule 拼的那个
        // <namespace>:<文件名去掉 .json>（它不看子目录），与模板走同一条规则。
        Map<String, String> controlGroupPresets = [:]
        Map<String, File> controlGroupPresetFiles = [:]
        packs.each { pack ->
            File dir = new File(pack.dir, 'control_groups')
            if (!dir.isDirectory()) {
                return
            }
            dir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                String stem = file.name.substring(0, file.name.length() - '.json'.length())
                controlGroupPresets[pack.namespace + ':' + stem] = pack.name
                controlGroupPresetFiles[pack.namespace + ':' + stem] = file
            }
        }

        // 模板 / 装配体 / 载具蓝图：id → 定义
        def templates = [:]
        def assemblies = [:]
        def blueprints = [:]
        packs.each { pack ->
            [templates: templates, assemblies: assemblies, blueprints: blueprints].each { String kind, Map bucket ->
                File dir = new File(pack.dir, kind)
                if (!dir.isDirectory()) {
                    return
                }
                dir.eachFileRecurse(FileType.FILES) { File file ->
                    if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                        return
                    }
                    String stem = file.name.substring(0, file.name.length() - '.json'.length())
                    bucket[pack.namespace + ':' + stem] = [pack: pack.name, file: file]
                }
            }
        }

        // 1. 模板 ↔ 装配体 ↔ 载具蓝图
        templates.keySet().sort().each { String id ->
            [assemblies: '装配体', blueprints: '载具蓝图'].each { String kind, String label ->
                def entry = (kind == 'assemblies' ? assemblies : blueprints)[id]
                if (entry == null) {
                    problems << '模板 ' + id + ' 缺' + label + '（' + kind + '/' +
                            id.substring(id.indexOf(':') + 1) + '.json）'
                }
            }
        }
        [assemblies: '装配体', blueprints: '载具蓝图'].each { String kind, String label ->
            Map bucket = (kind == 'assemblies' ? assemblies : blueprints)
            bucket.each { String id, Map entry ->
                Object data
                try {
                    data = readJsonc((File) entry.file)
                } catch (Exception exception) {
                    problems << entry.pack + '/' + kind + '/' + ((File) entry.file).name +
                            '：解析失败（' + exception.message + '）'
                    return
                }
                Object declared = data instanceof Map ? data.get('template') : null
                String template = declared == null ? null : declared.toString()
                if (template == null) {
                    problems << entry.pack + '/' + kind + '/' + ((File) entry.file).name + '：缺 template 字段'
                } else if (!templates.containsKey(template)) {
                    problems << entry.pack + '/' + kind + '/' + ((File) entry.file).name +
                            '：template ' + template + ' 找不到对应模板'
                    details.append('    引用  ').append(entry.pack).append('/').append(kind).append('/')
                            .append(((File) entry.file).name).append(' → ').append(template).append('\n')
                } else if (template != id) {
                    problems << entry.pack + '/' + kind + '/' + ((File) entry.file).name +
                            '：id ' + id + ' 与 template ' + template + ' 不同名，创造栏按模板 id 取的正是同名条目'
                }
            }
        }

        // 2. JSON 里的资源引用
        int referenceCount = 0
        int particleReferenceCount = 0
        int childParticleCount = 0
        int presetReferenceCount = 0
        int soundReferenceCount = 0
        // 贴图 / 模型只校验内置与模板命名空间，外部命名空间留给对应 mod 自己管
        def referencePattern = ~/^(machine_max|namespace):([A-Za-z0-9_.\/-]+\.(png|geo))$/
        // 说明页面按 AUI 文档根解析：namespace:tooltips/x.html → <包>/<namespace>/documents/tooltips/x.html
        def tooltipPattern = ~/^([a-z0-9_.-]+):([A-Za-z0-9_.\/-]+\.html)$/
        packs.each { pack ->
            pack.dir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                if (file.toPath().any { it.toString() == 'docs' }) {
                    return
                }
                Object data
                try {
                    data = readJsonc(file)
                } catch (Exception exception) {
                    return
                }
                String label = pack.name + '/' + pack.namespace + '/' +
                        pack.dir.toPath().relativize(file.toPath()).toString()
                                .replace(File.separatorChar, '/' as char)
                // 3. 材质的表现粒子（命中火花等）
                walkMaterialParticles(data) { String use, String value ->
                    particleReferenceCount++
                    if (!particleIds.contains(value)) {
                        problems << label + '：particles.' + use + ' ' + value +
                                ' 找不到粒子定义（particles/<名>.particle.json）'
                        details.append('    缺粒子  ').append(label).append(' → ')
                                .append('particles.').append(use).append(' = ').append(value).append('\n')
                    }
                }
                // 4. 粒子定义之间的事件引用（events 里的 particle_effect）
                if (file.name.endsWith('.particle.json')) {
                    walkChildParticles(data) { String value ->
                        childParticleCount++
                        if (!particleIds.contains(value)) {
                            problems << label + '：events 引用的子效果 ' + value +
                                    ' 找不到粒子定义（particles/<名>.particle.json）'
                            details.append('    缺粒子  ').append(label).append(' → ')
                                    .append('particle_effect.effect = ').append(value).append('\n')
                        }
                    }
                }
                // 5. 座位控制组预设（座位安装块的 control_group_preset）
                walkControlGroupPresets(data) { String subsystem, String preset ->
                    if (preset == 'machine_max:empty') {
                        return
                    }
                    presetReferenceCount++
                    if (!controlGroupPresets.containsKey(preset)) {
                        problems << label + '：子系统 ' + subsystem + ' 的 control_group_preset ' + preset +
                                ' 找不到控制组预设（control_groups/<名>.json）'
                        details.append('    缺预设  ').append(label).append(' → ')
                                .append(subsystem).append(' = ').append(preset).append('\n')
                    }
                }
                // 15. 音效事件引用（sound_id 指向已注册的事件，或它的 _interior 变体）
                walkSoundRefs(data) { String eventId ->
                    int colon = eventId.indexOf(':')
                    String namespace = colon > 0 ? eventId.substring(0, colon) : ''
                    if (!soundNamespaces.contains(namespace)) {
                        return
                    }
                    soundReferenceCount++
                    // 只有 <id>_interior 有录音是合法配置：车内换成该变体，车外静音
                    if (!soundEvents.contains(eventId) && !soundEvents.contains(eventId + '_interior')) {
                        problems << label + '：音效事件 ' + eventId + ' 没有注册（sounds/sounds.json 与 assets/' +
                                namespace + '/sounds.json 里既没有它，也没有 ' + eventId + '_interior）'
                        details.append('    缺音效  ').append(label).append(' → ')
                                .append(eventId).append('\n')
                    }
                }
                walkStrings(data) { String value ->
                    def tooltipMatcher = tooltipPattern.matcher(value)
                    if (tooltipMatcher.matches()) {
                        String namespace = tooltipMatcher.group(1)
                        String relative = tooltipMatcher.group(2)
                        boolean reachable = new File(pack.dir, 'documents/' + relative).isFile() ||
                                (sparkModulesDir.listFiles() ?: new File[0]).any {
                                    new File(it, namespace + '/documents/' + relative).isFile()
                                }
                        if (!reachable) {
                            pendingTooltips << label
                            details.append('    缺页面  ').append(label).append(' → ')
                                    .append(value).append('\n')
                        }
                        return
                    }
                    def matcher = referencePattern.matcher(value)
                    if (!matcher.matches()) {
                        return
                    }
                    referenceCount++
                    String namespace = matcher.group(1)
                    String relative = matcher.group(2)
                    String extension = matcher.group(3)
                    boolean reachable = extension == 'png'
                            ? resourceFiles.contains(relative)
                            : geoModels.contains(relative.substring(relative.lastIndexOf('/') + 1))
                    if (!reachable) {
                        problems << label + '：引用 ' + namespace + ':' + relative + ' 找不到文件'
                        details.append('    缺失  ').append(label).append(' → ')
                                .append(namespace).append(':').append(relative).append('\n')
                    }
                }
            }
        }

        // 3. 文档页面的样式表引用
        //
        // documents/ 下的文件在运行期挂成 apricity/<命名空间>/<相对路径>，<link href> 与
        // CSS 的 @import 都走 AUI 的 Loader.resolve。跨命名空间引用写绝对逻辑路径即可
        // （例如 /machine_max/weapon_hud_components/hud.css），不必把同一份样式表复制到每个包。
        int documentReferenceCount = 0
        Set<String> documentPaths = new LinkedHashSet<>()
        packs.each { pack ->
            File documents = new File(pack.dir, 'documents')
            if (!documents.isDirectory()) {
                return
            }
            documents.eachFileRecurse(FileType.FILES) { File file ->
                documentPaths << pack.namespace + '/' + documents.toPath()
                        .relativize(file.toPath()).toString()
                        .replace(File.separatorChar, '/' as char)
            }
        }
        def resolveDocumentPath = { String context, String raw ->
            String clean = raw.trim()
            int cut = clean.indexOf('#')
            if (cut >= 0) {
                clean = clean.substring(0, cut)
            }
            cut = clean.indexOf('?')
            if (cut >= 0) {
                clean = clean.substring(0, cut)
            }
            if (clean.isEmpty()) {
                return ''
            }
            if (clean.startsWith('/')) {
                return clean.substring(1)
            }
            String base = context.contains('/') ? context.substring(0, context.lastIndexOf('/')) : ''
            def stack = new ArrayDeque<String>()
            (base + '/' + clean).split('/').each { String part ->
                if (part.isEmpty() || part == '.') {
                    return
                }
                if (part == '..') {
                    if (!stack.isEmpty()) {
                        stack.pollLast()
                    }
                } else {
                    stack.addLast(part)
                }
            }
            return stack.join('/')
        }
        packs.each { pack ->
            File documents = new File(pack.dir, 'documents')
            if (!documents.isDirectory()) {
                return
            }
            documents.eachFileRecurse(FileType.FILES) { File file ->
                String lower = file.name.toLowerCase(Locale.ROOT)
                if (!lower.endsWith('.html') && !lower.endsWith('.css')) {
                    return
                }
                String relative = documents.toPath().relativize(file.toPath()).toString()
                        .replace(File.separatorChar, '/' as char)
                String context = pack.namespace + '/' + relative
                String label = pack.name + '/' + pack.namespace + '/documents/' + relative
                String text = file.getText('UTF-8')
                List<String> references = []
                if (lower.endsWith('.html')) {
                    def linkMatcher = (text =~ /<link\b[^>]*>/)
                    while (linkMatcher.find()) {
                        String tag = linkMatcher.group()
                        def relMatcher = (tag =~ /\brel\s*=\s*["']([^"']*)["']/)
                        if (!relMatcher.find() ||
                                !relMatcher.group(1).toLowerCase(Locale.ROOT).contains('stylesheet')) {
                            continue
                        }
                        def hrefMatcher = (tag =~ /\bhref\s*=\s*["']([^"']+)["']/)
                        if (hrefMatcher.find()) {
                            references << hrefMatcher.group(1)
                        }
                    }
                } else {
                    def importMatcher = (text =~ /@import\s+(?:url\()?\s*["']([^"')]+)["']/)
                    while (importMatcher.find()) {
                        references << importMatcher.group(1)
                    }
                }
                references.each { String raw ->
                    String trimmed = raw.trim()
                    if (trimmed.startsWith('http://') || trimmed.startsWith('https://') ||
                            trimmed.startsWith('data:')) {
                        return
                    }
                    String resolved = resolveDocumentPath(context, trimmed)
                    if (resolved.isEmpty()) {
                        return
                    }
                    if (documentPaths.contains(resolved)) {
                        documentReferenceCount++
                        return
                    }
                    problems << label + '：样式表 ' + trimmed + ' 解析为 ' + resolved +
                            '，不在任何内容包的 documents/ 下'
                }
            }
        }

        // 6. 语言键可达 + 中英键集一致
        //
        // 一条键“可达”指下列任一路径能取到它：
        //   a. 字面量出现在某个包的 lang/ 与 docs/ 之外的文件里（模板的 part.* 条目、控制组 /
        //      连接点 / 子系统名字、HTML 的 <translation>、配方里的 research.*.desc …），
        //      或出现在模组源码 src/main/{java,kotlin} 里；
        //   b. 由内容 id 按固定规则拼出：部件 / 装配体 / 蓝图 / 投射物的 <ns>.<文件名>，
        //      型号的 <ns>.fitting.<文件名>，研发的 <ns>.research.<文件名>；以及任何
        //      <ns>:<路径> 资源位置对应的两种写法（<ns>.<路径>、<ns>.<路径去掉斜杠>），
        //      标签 machine_max:series/ae86 与研发分组 type59:type59_turret 都走这条。
        def resourceIdPattern = ~/^[a-z0-9_.-]+:[a-z0-9_.\/-]+$/
        def languageKeys = [:] as Map
        // 中文语言文件的原始键值，供下面的“中文值是否真的写了中文”检查使用
        def zhLanguageValues = [:] as Map
        packs.each { pack ->
            File langDir = new File(pack.dir, 'lang')
            if (!langDir.isDirectory()) {
                return
            }
            def perFile = [:] as Map
            langDir.eachFile(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                Object data = readJsonc(file)
                perFile[file.name] = data instanceof Map ? data.keySet().collect { it.toString() } as Set : [] as Set
                if (file.name == 'zh_cn.json' && data instanceof Map) {
                    zhLanguageValues[pack.name] = data
                }
            }
            if (perFile) {
                languageKeys[pack.name] = perFile
            }
        }

        StringBuilder corpus = new StringBuilder()
        def appendTextFile = { File file ->
            String name = file.name.toLowerCase(Locale.ROOT)
            if (!(name.endsWith('.json') || name.endsWith('.html') || name.endsWith('.css') ||
                    name.endsWith('.js') || name.endsWith('.svg') || name.endsWith('.md') ||
                    name.endsWith('.txt'))) {
                return
            }
            corpus.append(file.getText('UTF-8')).append('\n' as char)
        }
        packs.each { pack ->
            pack.dir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.toPath().any { it.toString() == 'docs' || it.toString() == 'lang' }) {
                    return
                }
                appendTextFile(file)
            }
        }
        ['java', 'kotlin'].each { String sourceSet ->
            File sourceDir = new File(contentProjectDir, 'src/main/' + sourceSet)
            if (!sourceDir.isDirectory()) {
                return
            }
            sourceDir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.name.toLowerCase(Locale.ROOT).endsWith('.' + sourceSet)) {
                    corpus.append(file.getText('UTF-8')).append('\n' as char)
                }
            }
        }

        // 键名只由 ASCII 字母、数字、点、下划线、斜杠组成，所以在整段语料上按“连续记号”
        // 取词即可。取整记号而不是子串匹配：短键不会因为长键里含有它就被误判为可达。
        Set<String> literalTokens = new HashSet<>()
        (corpus.toString() =~ /[A-Za-z0-9_][A-Za-z0-9_.\/#-]*/).each { literalTokens << it.toString() }

        Set<String> derivedKeys = new HashSet<>()
        packs.each { pack ->
            String namespace = pack.namespace
            ['parts', 'assemblies', 'blueprints', 'projectiles'].each { String kind ->
                File dir = new File(pack.dir, kind)
                if (!dir.isDirectory()) {
                    return
                }
                dir.eachFileRecurse(FileType.FILES) { File file ->
                    if (file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                        derivedKeys << namespace + '.' + file.name.substring(0, file.name.length() - 5)
                    }
                }
            }
            ['fittings': 'fitting', 'recipe/research': 'research'].each { String kind, String prefix ->
                File dir = new File(pack.dir, kind)
                if (!dir.isDirectory()) {
                    return
                }
                dir.eachFileRecurse(FileType.FILES) { File file ->
                    if (file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                        derivedKeys << namespace + '.' + prefix + '.' +
                                file.name.substring(0, file.name.length() - 5)
                    }
                }
            }
            pack.dir.eachFileRecurse(FileType.FILES) { File file ->
                if (file.toPath().any { it.toString() == 'docs' || it.toString() == 'lang' }) {
                    return
                }
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                Object data
                try {
                    data = readJsonc(file)
                } catch (Exception ignored) {
                    return
                }
                walkStrings(data) { String value ->
                    if (!resourceIdPattern.matcher(value).matches()) {
                        return
                    }
                    int colon = value.indexOf(':')
                    String idNamespace = value.substring(0, colon)
                    String idPath = value.substring(colon + 1)
                    derivedKeys << idNamespace + '.' + idPath
                    derivedKeys << idNamespace + '.' + idPath.replace('/' as char, '.' as char)
                }
            }
        }

        int languageKeyCount = 0
        int untranslatedValueCount = 0
        languageKeys.sort { it.key }.each { String packName, Map perFile ->
            perFile.sort { it.key }.each { String fileName, Set keys ->
                String label = packName + '/lang/' + fileName
                keys.each { String key ->
                    languageKeyCount++
                    if (literalTokens.contains(key) || derivedKeys.contains(key)) {
                        return
                    }
                    problems << label + '：语言键 ' + key + ' 没有任何消费方' +
                            '（包内没有引用它的 JSON / HTML，模组源码不取该键，也拼不出这个 id）'
                }
            }
            Set zh = perFile['zh_cn.json']
            Set en = perFile['en_us.json']
            if (zh == null || en == null) {
                return
            }
            (zh - en).sort().each { problems << packName + '：语言键 ' + it + ' 只有中文，英文缺' }
            (en - zh).sort().each { problems << packName + '：语言键 ' + it + ' 只有英文，中文缺' }

            // 中文值必须真的写了中文。描述型键最终显示在装配界面、载具信息面板与蓝图文案里，
            // 若照抄英文，中文客户端会直接显示英文；键集齐全并不代表翻译完成。
            // 型号名（<ns>.<型号>、machine_max.series.*）与弹种 / 弹链标签（machine_max.ammo.*、
            // 投射物名）刻意保留英文，不在此列。
            Map zhValues = (Map) zhLanguageValues[packName]
            if (zhValues != null) {
                def descriptiveKey = ~/^(subsystem|sub_part|connector|interact|controlGroup|title|description|notes|author|research)\./
                def hanPattern = ~/[\u4e00-\u9fff]/
                zhValues.each { Object rawKey, Object rawValue ->
                    String key = rawKey == null ? '' : rawKey.toString()
                    if (!descriptiveKey.matcher(key).find()) {
                        return
                    }
                    if (!(rawValue instanceof String)) {
                        return
                    }
                    if (hanPattern.matcher((String) rawValue).find()) {
                        return
                    }
                    untranslatedValueCount++
                    problems << packName + '/lang/zh_cn.json：语言键 ' + key + ' 的中文值 “' +
                            rawValue + '” 不含汉字（应翻译；型号名与弹种标签除外）'
                }
            }
        }

        // 7. 控制组预设的越级量表键可达
        //
        // 只算五张输出目标表：按键绑定与 GUI 动作投递的是裸值，出口处不带越级量，
        // 把它们的频道写进 priorities 不会生效。子组可见的频道是基础组与它自己的并集
        // （合并口径与 ControlGroupSet#getMergedViewTargets 一致）。
        int priorityKeyCount = 0
        controlGroupPresetFiles.keySet().sort().each { String presetId ->
            File presetFile = (File) controlGroupPresetFiles[presetId]
            Object raw = readJsonc(presetFile)
            if (!(raw instanceof Map)) {
                return
            }
            Map data = (Map) raw
            Set<String> baseChannels = presetChannels(data.get('base_group'))
            def checkPriorities = { String groupLabel, Object group, Set<String> available ->
                if (!(group instanceof Map)) {
                    return
                }
                Object table = ((Map) group).get('priorities')
                if (!(table instanceof Map)) {
                    return
                }
                table.keySet().each { Object key ->
                    priorityKeyCount++
                    if (available.contains(key.toString())) {
                        return
                    }
                    problems << presetId + '：' + groupLabel + ' 的 priorities 里 ' + key +
                            ' 不是这一组会发出的频道（' + (available ? available.sort().join('、') : '无') + '）'
                    details.append('    越级量键  ').append(presetId).append(' / ').append(groupLabel)
                            .append(' → ').append(key).append('\n')
                }
            }
            checkPriorities('base_group', data.get('base_group'), baseChannels)
            List groups = data.get('groups') instanceof List ? (List) data.get('groups') : []
            groups.eachWithIndex { Object group, int index ->
                Set<String> merged = new LinkedHashSet<>(baseChannels)
                merged.addAll(presetChannels(group))
                checkPriorities('groups[' + index + ']', group, merged)
            }
        }

        // 8. 单变体内「子系统 / 交互区 / 连接点」名字唯一且不使用信号保留地址
        //
        // 运行期按名字解析的作用域是单个 Part 实例，也就是单份变体定义；三类名字共用一套
        // 命名空间（VariantAttr#validateUniqueNames 是解码期权威校验）。运行期没有并列分支：
        // 命中即返回，重名会静默地只解析到其中第一个。这里把同一判据提前到构建期，
        // 免得作者写完内容、进游戏放不出该部件类型才发现。
        int partDefinitionCount = 0
        int partVariantCount = 0
        Set<String> reservedSignalNames = ['local', 'global'] as Set
        packs.each { pack ->
            File partsDir = new File(pack.dir, 'parts')
            if (!partsDir.isDirectory()) {
                return
            }
            partsDir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                Object data
                try {
                    data = readJsonc(file)
                } catch (Exception exception) {
                    problems << pack.name + '/' + pack.dir.toPath().relativize(file.toPath()).toString()
                            .replace(File.separatorChar, '/' as char) + '：解析失败（' + exception.message + '）'
                    return
                }
                if (!(data instanceof Map)) {
                    return
                }
                Object variantsRaw = ((Map) data).get('variants')
                if (!(variantsRaw instanceof Map)) {
                    return
                }
                Map variantsObj = (Map) variantsRaw
                Map variantEntries
                if (variantsObj.get('sub_parts') instanceof Map) {
                    variantEntries = ['default': variantsObj]
                } else {
                    variantEntries = variantsObj
                }
                String relative = pack.name + '/' + pack.dir.toPath().relativize(file.toPath()).toString()
                        .replace(File.separatorChar, '/' as char)
                partDefinitionCount++
                variantEntries.each { Object variantName, Object variantRaw ->
                    if (!(variantRaw instanceof Map)) {
                        return
                    }
                    Map variant = (Map) variantRaw
                    Object subPartsRaw = variant.get('sub_parts')
                    if (!(subPartsRaw instanceof Map)) {
                        return
                    }
                    partVariantCount++
                    Map<String, String> ownerByName = [:]
                    [['connectors', '连接点'], ['subsystems', '子系统'], ['interact_boxes', '交互区']].each { List pair ->
                        String field = pair[0]
                        String label = pair[1]
                        ((Map) subPartsRaw).each { Object subPartName, Object subPartRaw ->
                            if (!(subPartRaw instanceof Map)) {
                                return
                            }
                            Object namesRaw = ((Map) subPartRaw).get(field)
                            if (!(namesRaw instanceof Map)) {
                                return
                            }
                            ((Map) namesRaw).keySet().each { Object nameRaw ->
                                String name = nameRaw.toString()
                                if (reservedSignalNames.contains(name)) {
                                    problems << relative + '：变体 ' + variantName + ' 的子零件 ' + subPartName +
                                            ' 把信号保留地址 ' + name + ' 用作' + label + '名' +
                                            '（保留地址只作为 signal_targets 的目标，不能当节点名）'
                                    return
                                }
                                String owner = subPartName + '/' + label
                                String previous = ownerByName[name]
                                if (previous == null) {
                                    ownerByName[name] = owner
                                    return
                                }
                                problems << relative + '：变体 ' + variantName + ' 内名称 ' + name + ' 重复：' +
                                        previous + ' 与 ' + owner + ' 冲突' +
                                        '（子系统 / 交互区 / 连接点共用一套命名空间，重名时按名解析只命中其中一个）'
                                details.append('    重名  ').append(relative).append(' / 变体 ')
                                        .append(variantName).append(' / ').append(name).append(' → ')
                                        .append(previous).append('、').append(owner).append('\n')
                            }
                        }
                    }
                }
            }
        }

        // 9. 跨连接点的信号线：到达频道必须被目标子系统接受
        //
        // 连接点的 signal_targets 键是「转译之后」的到达频道：对侧端口转发时先用本连接点的
        // signal_translations 转译，再按这个键取目标表。真正投递前端口会核对目标子系统声明的接受频道
        // （SignalPort 的 accepts 检查，acceptAllRoutingInput 为真时跳过），不在列表里的接收者被直接
        // continue，既不写输入槽也不打日志。症状是「车门交互区看得见、按了没反应」或「座位占用传不到
        // 车门」，而且内容里它与一条正常的线长得一样——同件具名直送不看频道名，所以只有跨连接点的
        // 线路会出现这种错位。
        //
        // 接受频道取自各类型 getAcceptedChannels() 实际读的字段：型号 JSON 的字段用下面表里的默认值
        // （与属性 Codec 的 optionalFieldOf 默认值一致，改 Codec 默认值要同步这张表）；安装块里的字段
        // 同样按表读取。表里没有的类型不检查，目标写 local / global / 连接点 / 交互区的线也不检查——
        // 前者没有排他性的接受列表，后三者不按频道筛选。
        //
        // 本节还拦第二种写法：内部连接点（"internal": true）上的 signal_targets / signal_translations。
        // 内部连接点由 AbstractPart#autoAttachInternalConnectors 在同一 Part 内按「高级 + 简单、不同子零件、
        // 几何对齐」自动配对，两端必然同属一个 Part，而名字解析的作用域就是整个 Part
        // （ISignalSender#setTargetFromNames），所以把目标直接写成子系统名即可到达。绕经它的线路多一条
        // 几何配对依赖：配不上（或配对有歧义被跳过）时端口对不上，线静默断开，内容里看不出来。
        Map<String, File> subsystemDefinitions = [:]
        // 第 14 节用：连接点型号（joint_attrs 在这里），按 <命名空间>:<文件名> 索引。
        Map<String, File> connectorDefinitions = [:]
        packs.each { pack ->
            File dir = new File(pack.dir, 'subsystems')
            if (dir.isDirectory()) {
                dir.eachFileRecurse(FileType.FILES) { File file ->
                    if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                        return
                    }
                    String stem = file.name.substring(0, file.name.length() - '.json'.length())
                    subsystemDefinitions[pack.namespace + ':' + stem] = file
                }
            }
            File connectorsDir = new File(pack.dir, 'connectors')
            if (!connectorsDir.isDirectory()) {
                return
            }
            connectorsDir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                String stem = file.name.substring(0, file.name.length() - '.json'.length())
                connectorDefinitions[pack.namespace + ':' + stem] = file
            }
        }

        // Neutral third-person aim bias must be reachable within the seat's effective pitch bounds.
        subsystemDefinitions.each { String id, File file ->
            try {
                Object parsed = readJsonc(file)
                if (!(parsed instanceof Map) || ((Map) parsed).get('type')?.toString() != 'machine_max:seat') {
                    return
                }
                Object rawViews = ((Map) parsed).get('views')
                Map views = rawViews instanceof Map ? (Map) rawViews : [:]
                Object rawBias = views.get('third_person_pitch_bias')
                Object rawMin = views.get('min_pitch')
                Object rawMax = views.get('max_pitch')
                if (views.containsKey('third_person_pitch_bias') && !(rawBias instanceof Number)) {
                    problems << id + '：third_person_pitch_bias 必须是数值'
                    details.append('    无效第三人称俯仰偏置类型  ').append(file).append(' → ')
                            .append(rawBias == null ? 'null' : rawBias.getClass().getSimpleName()).append('\n')
                    return
                }
                double bias = rawBias instanceof Number ? ((Number) rawBias).doubleValue() : 15.0
                double minPitch = rawMin instanceof Number ? ((Number) rawMin).doubleValue() : -70.0
                double maxPitch = rawMax instanceof Number ? ((Number) rawMax).doubleValue() : 45.0
                if (!Double.isFinite(bias) || bias < 0 || bias > 20) {
                    problems << id + '：third_person_pitch_bias 必须是 0..20 度的有限数值'
                    details.append('    无效第三人称俯仰偏置  ').append(file).append(' → ').append(bias).append('\n')
                } else if (Double.isFinite(minPitch) && Double.isFinite(maxPitch)
                        && (bias < minPitch || bias > maxPitch)) {
                    problems << id + '：中性偏置 ' + bias + '° 超出有效俯仰范围 [' + minPitch + '°, ' + maxPitch + '°]'
                    details.append('    中性偏置将被俯仰限位裁剪  ').append(file).append(' → bias=').append(bias)
                            .append('°, range=[').append(minPitch).append('°, ').append(maxPitch).append('°]\n')
                }
            } catch (Exception ignored) {
                // The subsystem codec reports malformed definitions during content loading.
            }
        }

        // 第 16 节用：所有 camera / sight 型号声明过的接受频道。视点发现表里的 local / global
        // 由接收侧按自己的 discovery_inputs 筛选，频道不在这个并集里就永远命中不了。
        Set<String> viewpointDiscoveryChannels = new LinkedHashSet<>()
        subsystemDefinitions.each { String id, File file ->
            try {
                Object parsed = readJsonc(file)
                if (!(parsed instanceof Map)) {
                    return
                }
                Object type = ((Map) parsed).get('type')
                if (type == null
                        || (type.toString() != 'machine_max:camera' && type.toString() != 'machine_max:sight')) {
                    return
                }
                Object inputs = ((Map) parsed).get('discovery_inputs')
                if (inputs instanceof List) {
                    ((List) inputs).each { Object channel -> viewpointDiscoveryChannels << channel.toString() }
                }
            } catch (Exception ignored) {
                // 型号 JSON 读不出来由解码期拒绝，这里不重复报
            }
        }

        def acceptedChannelFields = [
                'machine_max:seat'                : [static : [interact_inputs: ['interact']],
                                                     install: [interact_inputs: [], loader_discovery_inputs: []]],
                'machine_max:item_storage'        : [static : [interact_inputs: ['interact']], install: [:]],
                'machine_max:engine'              : [static : [control_inputs: ['car_control']], install: [:]],
                'machine_max:motor'               : [static : [control_inputs: ['car_control']], install: [:]],
                'machine_max:gearbox'             : [static : [control_inputs: ['car_control']], install: [:]],
                'machine_max:transmission'        : [static : [control_inputs: ['car_control']], install: [:]],
                'machine_max:wheel_driver'        : [static : [control_inputs: ['car_control']], install: [:]],
                'machine_max:track_drive'         : [static : [control_inputs: ['car_control']], install: [:]],
                'machine_max:turret_driver'       : [static : [control_inputs: ['weapon_control']], install: [:]],
                'machine_max:car_controller'      : [static : [control_inputs: ['crew_driver_move', 'crew_driver_regular',
                                                                                'crew_commander_move', 'crew_commander_regular']],
                                                     install: [:]],
                'machine_max:track_controller'    : [static : [control_inputs: ['crew_driver_move', 'crew_driver_regular',
                                                                                'crew_commander_move', 'crew_commander_regular']],
                                                     install: [:]],
                'machine_max:motorbike_controller': [static : [control_inputs: ['crew_driver_move', 'crew_commander_move']],
                                                     install: [:]],
                'machine_max:weapon_controller'   : [static : [aim_inputs : ['crew_gunner_aim', 'crew_commander_aim', 'crew_any_aim'],
                                                                fire_inputs: ['crew_gunner_fire', 'crew_commander_fire', 'crew_any_fire']],
                                                     install: [:],
                                                     always: ['ammo_switch']],
                // control_inputs 为空时 acceptAllRoutingInput() 为真，等于接受任意频道
                'machine_max:launcher'            : [static : [control_inputs: ['weapon_control']], install: [:],
                                                     acceptsAllWhenEmpty: true],
                'machine_max:camera'              : [static : [discovery_inputs      : ['camera_sight'],
                                                               tracking_target_inputs: ['tracking_target']], install: [:]],
                'machine_max:sight'               : [static : [discovery_inputs: ['camera_sight']], install: [:]],
                'machine_max:lighting'            : [static : [:], install: [:], always: ['toggle_light']],
                'machine_max:ammo_loader'         : [static : [:], install: [ammo_discovery_inputs: []]],
                'machine_max:regen_ammo_rack'     : [static : [:], install: [ammo_discovery_inputs: []]],
                // 锁扣只经连接点端口接受交互区的解扣请求；频道是端口到达标签，不是新增的信号输入
                'machine_max:coupler'             : [static : [:], install: [:], always: ['interact']]
        ]

        Map<String, Object> definitionCache = [:]
        def acceptedChannelsOf = { Map fields, Map install ->
            Set<String> channels = new LinkedHashSet<>()
            ((List) (fields.get('always') ?: [])).each { channels << it.toString() }
            Map definition = null
            Object definitionRaw = install.get('definition')
            if (definitionRaw != null) {
                def definitionId = definitionRaw.toString()
                File definitionFile = subsystemDefinitions[definitionId]
                if (definitionFile != null) {
                    if (!definitionCache.containsKey(definitionId)) {
                        Object parsed = null
                        try {
                            parsed = readJsonc(definitionFile)
                        } catch (Exception ignored) {
                            // 型号 JSON 读不出来由解码期拒绝，这里按默认值继续，不重复报
                        }
                        definitionCache[definitionId] = parsed
                    }
                    Object cached = definitionCache[definitionId]
                    if (cached instanceof Map) {
                        definition = (Map) cached
                    }
                }
            }
            ((Map) (fields.get('static') ?: [:])).each { String field, Object fallback ->
                Object value = definition == null ? null : definition.get(field)
                List list = value instanceof List ? (List) value : (List) fallback
                list.each { channels << it.toString() }
            }
            ((Map) (fields.get('install') ?: [:])).each { String field, Object fallback ->
                Object value = install.get(field)
                List list = value instanceof List ? (List) value : (List) fallback
                list.each { channels << it.toString() }
            }
            channels
        }

        int portWireCount = 0
        int interactTargetCount = 0
        int eventWireRefCount = 0
        int viewpointDiscoveryTargetCount = 0
        // 第 14 节用：连接点的关节属性（含 overwrite 覆盖），按型号 JSON 缓存。
        Map<String, Object> connectorDefinitionCache = [:]
        def jointAttrsOf = { Map connectorBlock ->
            if (connectorBlock == null) {
                return null
            }
            Object overwrite = connectorBlock.get('overwrite')
            if (overwrite instanceof Map && ((Map) overwrite).get('joint_attrs') instanceof Map) {
                return (Map) ((Map) overwrite).get('joint_attrs')
            }
            Object definitionId = connectorBlock.get('definition')
            if (definitionId == null) {
                return null
            }
            String id = definitionId.toString()
            if (!connectorDefinitionCache.containsKey(id)) {
                File file = connectorDefinitions[id]
                Object parsed = null
                if (file != null) {
                    try {
                        parsed = readJsonc(file)
                    } catch (Exception ignored) {
                        // 型号 JSON 读不出来由解码期拒绝，这里按「没有关节属性」继续
                    }
                }
                connectorDefinitionCache[id] = parsed
            }
            Object parsed = connectorDefinitionCache[id]
            return parsed instanceof Map ? (Map) ((Map) parsed).get('joint_attrs') : null
        }

        // 第 14 节用：模型里的定位器位置。只在「轮驱动全是转向轮」的变体上真的读模型。
        Map<String, File> modelFiles = [:]
        packs.each { pack ->
            File dir = new File(pack.dir, 'models')
            if (!dir.isDirectory()) {
                return
            }
            dir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.geo.json')) {
                    return
                }
                String stem = file.name.substring(0, file.name.length() - '.json'.length())
                modelFiles[pack.namespace + ':' + stem] = file
            }
        }
        Map<String, Map<String, List<Double>>> modelLocatorCache = [:]
        def collectLocators
        collectLocators = { Object node, Map<String, List<Double>> out ->
            if (node instanceof Map) {
                Object locators = ((Map) node).get('locators')
                if (locators instanceof Map) {
                    ((Map) locators).each { Object locatorName, Object locatorValue ->
                        Object raw = locatorValue instanceof Map
                                ? ((Map) locatorValue).get('position') : locatorValue
                        if (raw instanceof List) {
                            List<Double> position = []
                            ((List) raw).each { Object component ->
                                if (component instanceof Number) {
                                    position << ((Number) component).doubleValue()
                                }
                            }
                            out[locatorName.toString()] = position
                        }
                    }
                }
                ((Map) node).values().each { collectLocators(it, out) }
            } else if (node instanceof List) {
                ((List) node).each { collectLocators(it, out) }
            }
        }
        def modelLocatorsOf = { Map variantRaw, Map<String, Map<String, List<Double>>> cache ->
            Object modelId = variantRaw.get('model')
            if (modelId == null) {
                return (Map<String, List<Double>>) [:]
            }
            String id = modelId.toString()
            if (!cache.containsKey(id)) {
                File file = modelFiles[id]
                Map<String, List<Double>> locators = [:]
                if (file != null) {
                    try {
                        collectLocators(readJsonc(file), locators)
                    } catch (Exception ignored) {
                        // 模型读不出来时按「没有定位器」继续，不重复报
                    }
                }
                cache[id] = locators
            }
            return cache[id]
        }
        // 第 12 节用：五类名字键（子零件 / 子系统 / 连接点 / 交互区）的声明点，遍历 parts 时顺手收集。
        Map<String, String> nameDeclarations = [:]
        // 第 13 节用：每个变体的名字集合与它使用的动画名，同样在遍历 parts 时收集。
        List<Map> variantScopes = []
        // 第 16 节反查用：每个「零件 id|变体」的发现频道、具名目标与视点，供按模板装配体核对。
        Map<String, Map> viewpointScopes = [:]
        // 第 11 节跨零件事件线用：每个「零件 id|变体」的连接点信号表与交互区写出去的跨零件频道。
        Map<String, Map> interactScopes = [:]
        // 按「零件 id|变体|连接点」记录它在模板里被配对过的连接点，供反查「这条线在所有模板里都没配对」。
        Set<String> templatedConnectorPairs = new LinkedHashSet<>()
        Set<String> templatedParts = new LinkedHashSet<>()
        def interactScopeOf = { Object partId, Object variantName ->
            if (partId == null) return null
            Map scope = (Map) interactScopes[partId.toString() + '|' + variantName.toString()]
            if (scope == null) {
                // 单变体零件在文件里没有变体名，模板可能写成任意名字：按零件 id 取唯一那一份
                scope = (Map) interactScopes.find { it.key.toString().startsWith(partId.toString() + '|') }?.value
            }
            scope
        }
        packs.each { pack ->
            File partsDir = new File(pack.dir, 'parts')
            if (!partsDir.isDirectory()) {
                return
            }
            partsDir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                Object data
                try {
                    data = readJsonc(file)
                } catch (Exception ignored) {
                    return // 解析失败已由第 8 节报出
                }
                if (!(data instanceof Map)) {
                    return
                }
                Object variantsRaw = ((Map) data).get('variants')
                if (!(variantsRaw instanceof Map)) {
                    return
                }
                Map variantsObj = (Map) variantsRaw
                Map variantEntries = variantsObj.get('sub_parts') instanceof Map
                        ? ['default': variantsObj]
                        : variantsObj
                String relative = pack.name + '/' + pack.dir.toPath().relativize(file.toPath()).toString()
                        .replace(File.separatorChar, '/' as char)
                variantEntries.each { Object variantName, Object variantRaw ->
                    if (!(variantRaw instanceof Map)) {
                        return
                    }
                    Object subPartsRaw = ((Map) variantRaw).get('sub_parts')
                    if (!(subPartsRaw instanceof Map)) {
                        return
                    }
                    // 简写：只有一个零件时直接写 SubPartAttr 对象，名字固定为
                    // sub_part.machine_max.main（VariantAttr.SUB_PART_MAP_CODEC 的 either 先试单个对象）。
                    // 名字映射的键全部以 sub_part. 开头，而 SubPartAttr 的字段里没有这种键，据此区分。
                    Map subPartEntries = ((Map) subPartsRaw).isEmpty() ||
                            ((Map) subPartsRaw).keySet().any { !it.toString().startsWith('sub_part.') }
                            ? [('sub_part.machine_max.main'): subPartsRaw]
                            : (Map) subPartsRaw
                    Map<String, Map> subsystems = [:]
                    Map<String, Map> connectors = [:]
                    Map<String, Map> interactBoxes = [:]
                    subPartEntries.each { Object subPartName, Object subPartRaw ->
                        if (!(subPartRaw instanceof Map)) {
                            return
                        }
                        Object subsRaw = ((Map) subPartRaw).get('subsystems')
                        if (subsRaw instanceof Map) {
                            ((Map) subsRaw).each { Object name, Object block ->
                                if (block instanceof Map) {
                                    subsystems[name.toString()] = (Map) block
                                }
                            }
                        }
                        Object connectorsRaw = ((Map) subPartRaw).get('connectors')
                        if (connectorsRaw instanceof Map) {
                            ((Map) connectorsRaw).each { Object name, Object block ->
                                if (block instanceof Map) {
                                    connectors[name.toString()] = (Map) block
                                }
                            }
                        }
                        Object interactBoxesRaw = ((Map) subPartRaw).get('interact_boxes')
                        if (interactBoxesRaw instanceof Map) {
                            ((Map) interactBoxesRaw).each { Object name, Object block ->
                                if (block instanceof Map) {
                                    interactBoxes[name.toString()] = (Map) block
                                }
                            }
                        }
                    }
                    // 17. 非根子零件必须有内部连接点（根 = 质量最大的子零件，与
                    // VariantAttr.selectRootSubPartName 同口径；并列最大的一律跳过，避免误报）。
                    if (subPartEntries.size() > 1) {
                        Map<String, Double> subPartMasses = [:]
                        Map<String, Integer> internalConnectorCounts = [:]
                        subPartEntries.each { Object name, Object subPartRaw ->
                            if (!(subPartRaw instanceof Map)) {
                                return
                            }
                            Object massRaw = ((Map) subPartRaw).get('mass')
                            subPartMasses[name.toString()] =
                                    massRaw instanceof Number ? ((Number) massRaw).doubleValue() : 0d
                            int count = 0
                            Object consRaw = ((Map) subPartRaw).get('connectors')
                            if (consRaw instanceof Map) {
                                ((Map) consRaw).each { Object ignoredName, Object connectorRaw ->
                                    if (connectorRaw instanceof Map
                                            && Boolean.TRUE == ((Map) connectorRaw).get('internal')) {
                                        count++
                                    }
                                }
                            }
                            internalConnectorCounts[name.toString()] = count
                        }
                        if (subPartMasses) {
                            double maxMass = subPartMasses.values().max()
                            subPartMasses.each { String name, Double mass ->
                                if (mass < maxMass || internalConnectorCounts[name] > 0) {
                                    return
                                }
                                problems << relative + '：变体 ' + variantName + ' 的子零件 ' + name +
                                        ' 没有内部连接点——构造期不会有任何关节约束它，入世后会作为自由刚体掉落；' +
                                        '可开件用 internal 铰链 + 非 internal 锁扣，可分离件自成 Part'
                            }
                        }
                    }
                    String declarationLabel = relative + '：变体 ' + variantName
                    // 第 11 节跨零件事件线用：本变体每个连接点的两张信号表（对侧端口读的就是这两张），
                    // 以及交互区有多少条频道把目标写成连接点（= 事件要跨零件）。
                    String partId = pack.namespace + ':' + file.name.substring(0, file.name.length() - '.json'.length())
                    Map<String, Map> connectorSignalTables = [:]
                    connectors.each { Object connectorName, Map connector ->
                        connectorSignalTables[connectorName.toString()] = [
                                targets     : connector.get('signal_targets'),
                                translations: connector.get('signal_translations')]
                    }
                    List<Map> eventWires = []
                    // 固定源：同一个连接点上的频道名是唯一标识（对侧按「到达频道」查表，表是每个连接点一张）。
                    // 两个交互区往同一个连接点送同一个频道时，对侧只看到一种到达频道，分不出是谁点的。
                    // 透传形状（多个交互区共用一个连接点，由中间件按名分发，如 AE86 车壳→车架）靠的就是
                    // 各交互区各自的频道名，因此这条只拦"重名"，不拦"共用连接点"。
                    Map<String, Map<String, String>> connectorChannelOwners = [:]
                    interactBoxes.each { Object boxName, Map box ->
                        Object boxTargetsRaw = box.get('signal_targets')
                        if (!(boxTargetsRaw instanceof Map)) {
                            return
                        }
                        ((Map) boxTargetsRaw).each { Object channelRaw, Object namesRaw ->
                            if (!(namesRaw instanceof List)) {
                                return
                            }
                            String channel = channelRaw.toString()
                            ((List) namesRaw).each { Object targetRaw ->
                                String target = targetRaw.toString()
                                if (!connectors.containsKey(target)) {
                                    // 直接落在总线上的目标就是事件线：到达频道必须能对上某个控制器的事件表，
                                    // 否则零件状态机按 event.<频道> 查不到，点击静默无事发生。
                                    if ((target == 'local' || target == 'global') && !animationEvents.contains(channel)) {
                                        problems << relative + '：变体 ' + variantName + ' 的交互区 ' + boxName +
                                                ' 把频道 ' + channel + ' 送到 ' + target +
                                                '，但没有任何动画控制器声明 event.' + channel +
                                                '——事件在总线上没有接收者，点击只表现为没反应'
                                    }
                                    return
                                }
                                Map<String, String> owners = connectorChannelOwners.computeIfAbsent(target) { [:] }
                                String previous = owners.put(channel, boxName.toString())
                                if (previous != null && previous != boxName.toString()) {
                                    problems << relative + '：变体 ' + variantName + ' 的交互区 ' + boxName +
                                            ' 与 ' + previous + ' 都往连接点 ' + target + ' 送频道 ' + channel +
                                            '——同一个连接点上的到达频道是唯一标识，两条线会在对侧合流、分不出是谁点的；' +
                                            '多个交互区共用连接点时（透传形状）要给每个交互区各自的频道名'
                                }
                                eventWires << [box: boxName.toString(), channel: channel, connector: target]
                            }
                        }
                    }
                    interactScopes[partId + '|' + variantName] = [
                            label     : relative,
                            connectors: connectorSignalTables,
                            wires     : eventWires]
                    subPartEntries.keySet().each { Object name ->
                        nameDeclarations.putIfAbsent(name.toString(), declarationLabel)
                    }
                    subsystems.keySet().each { String name ->
                        nameDeclarations.putIfAbsent(name, declarationLabel)
                    }
                    connectors.keySet().each { String name ->
                        nameDeclarations.putIfAbsent(name, declarationLabel)
                    }
                    interactBoxes.keySet().each { String name ->
                        nameDeclarations.putIfAbsent(name, declarationLabel)
                    }
                    // 第 13 节用：本变体自己声明的名字集合 + 它使用的动画集（缺省与模型同名）。
                    Set<String> ownNames = new LinkedHashSet<>()
                    subPartEntries.keySet().each { Object name -> ownNames << name.toString() }
                    ownNames.addAll(subsystems.keySet())
                    ownNames.addAll(connectors.keySet())
                    ownNames.addAll(interactBoxes.keySet())
                    Object modelRaw = ((Map) variantRaw).get('model')
                    String modelRef = modelRaw instanceof CharSequence ? modelRaw.toString() : null
                    Object animationRaw = ((Map) variantRaw).get('animations')
                    Object controllerRaw = ((Map) variantRaw).get('controllers')
                    String animationName = null
                    if (animationRaw instanceof CharSequence) {
                        // 显式动画集：machine_max:empty 表示没有动画集，其余必须能找到目录。
                        String declared = animationRaw.toString()
                        if (declared != 'machine_max:empty') {
                            animationName = declared.substring(declared.indexOf(':') + 1)
                            if (!animationSets.contains(contentSetId(declared, 'part'))) {
                                problems << relative + '：变体 ' + variantName + ' 的 animations ' + declared +
                                        ' 没有对应的动画集（在 animations/part/' + animationName + '/ 下放动画文件，' +
                                        '或删掉该字段改用与模型同名的缺省绑定）'
                            }
                        }
                    } else if (modelRef != null) {
                        animationName = modelRef.substring(modelRef.indexOf(':') + 1)
                    }
                    if (controllerRaw instanceof CharSequence) {
                        // 显式控制器集：控制器集会驱动整套动作，写错时动画完全不播、没有日志。
                        String declared = controllerRaw.toString()
                        if (!controllerSets.contains(contentSetId(declared, 'part'))) {
                            problems << relative + '：变体 ' + variantName + ' 的 controllers ' + declared +
                                    ' 没有对应的控制器集（在 controllers/part/' +
                                    declared.substring(declared.indexOf(':') + 1) + '/ 下放控制器文件，' +
                                    '或删掉该字段改用与模型同名的缺省绑定）'
                        }
                    }
                    variantScopes << [label: declarationLabel, variant: variantName.toString(),
                                      names: ownNames, animation: animationName]
                    // 13. 名字引用：变体内以字符串出现的名字键必须落在本变体自己的子零件里。
                    // `AbstractPart#findConnector` / `#findSubsystem` 只查本部件，所以引用了本变体
                    // 没声明的名字时，MoLang 条件恒假、动画查询恒为 0，既不报错也不刷日志。
                    List<String> referenced = []
                    collectNameRefs(variantRaw, referenced)
                    referenced.unique().each { String ref ->
                        if (ownNames.contains(ref)) {
                            return
                        }
                        problems << relative + '：变体 ' + variantName + ' 引用的名字 ' + ref +
                                ' 不在本变体内（碰撞箱 / 交互区条件恒假、动画查询恒为 0，没有日志）'
                    }
                    // local / global 是交互事件专用目标：点击时把频道名作为动画事件投给所属 Part（local）
                    // 或交给装配体广播给全载具部件（global），两者都不参与终端解析。
                    // 其余目标只能是本变体内存在的子系统，或跨零件用的本变体连接点。
                    // 两个事件目标不能写在同一条频道上：同一次点击会经两条通路把同一个事件投两遍。
                    interactBoxes.each { Object boxName, Map box ->
                        Object boxTargetsRaw = box.get('signal_targets')
                        if (!(boxTargetsRaw instanceof Map)) {
                            return
                        }
                        ((Map) boxTargetsRaw).each { Object channelRaw, Object namesRaw ->
                            if (!(namesRaw instanceof List)) {
                                return
                            }
                            List names = (List) namesRaw
                            if (names.any { it.toString() == 'local' } && names.any { it.toString() == 'global' }) {
                                problems << relative + '：变体 ' + variantName + ' 的交互区 ' + boxName +
                                        ' 的频道 ' + channelRaw + ' 同时指向 local 与 global——同一次点击会经' +
                                        '「线网到 local 总线」与「装配体广播全零件」两条通路把同一个事件投两遍；' +
                                        '只写会真正响应它的那一个'
                            }
                            ((List) namesRaw).each { Object targetRaw ->
                                String target = targetRaw.toString()
                                if (target == 'local' || target == 'global') {
                                    return
                                }
                                interactTargetCount++
                                if (!subsystems.containsKey(target) && !connectors.containsKey(target)) {
                                    problems << relative + '：变体 ' + variantName + ' 的交互区 ' + boxName +
                                            ' 的目标 ' + target + ' 不是本变体内的子系统或连接点' +
                                            '（跨零件写连接点名；交互区只发不收，不能当目标）'
                                }
                            }
                        }
                    }
                    // 16. 视点发现表：取值域、广播频道与禁用 camera_sight
                    //
                    // 座位与武器控制器的 camera_discovery_targets 由 resolveTargets 解析成视点。
                    // 具名目标不走接收侧接受频道（最后一行直接当终端收下），所以名字写错或指向
                    // 别的类型时发现结果为空；local / global 与连接点名要过视点的 discovery_inputs，
                    // 频道写错时永远命中不了。两种都只表现为「少一个视角」，没有日志。
                    // 作用域是安装块所在变体的 sub_parts，也就是运行期这一个 Part 实例
                    // （setTargetFromNames 扫的就是 owner.part.subParts）。
                    subsystems.each { Object viewpointOwnerName, Map viewpointOwner ->
                        Object discoveryRaw = viewpointOwner.get('camera_discovery_targets')
                        if (!(discoveryRaw instanceof Map)) {
                            return
                        }
                        ((Map) discoveryRaw).each { Object channelRaw, Object namesRaw ->
                            String discoveryChannel = channelRaw.toString()
                            if (!(namesRaw instanceof List)) {
                                problems << relative + '：变体 ' + variantName + ' 的 ' + viewpointOwnerName +
                                        ' 的视点发现频道 ' + discoveryChannel + ' 不是目标名列表'
                                return
                            }
                            if (discoveryChannel == 'camera_sight') {
                                problems << relative + '：变体 ' + variantName + ' 的 ' + viewpointOwnerName +
                                        ' 的视点发现频道写成了 camera_sight——那是每台视点未声明接受频道时的' +
                                        '默认值，等于把全车所有视点都算进来；要表达「这台视点归谁」，' +
                                        '频道名必须是内容自己的设备词（sight_rws、sight_port_mg …）'
                            }
                            boolean discoveryBroadcast = false
                            ((List) namesRaw).each { Object targetRaw ->
                                String viewTarget = targetRaw.toString()
                                viewpointDiscoveryTargetCount++
                                if (viewTarget == 'local' || viewTarget == 'global') {
                                    discoveryBroadcast = true
                                    return
                                }
                                if (viewTarget.startsWith('subsystem.')) {
                                    Map install = subsystems[viewTarget]
                                    if (install == null) {
                                        problems << relative + '：变体 ' + variantName + ' 的 ' + viewpointOwnerName +
                                                ' 的视点发现目标 ' + viewTarget + ' 不在本变体内' +
                                                '（作用域是这一个 Part 实例；跨 Part 只能写连接点名或 global）'
                                        return
                                    }
                                    String targetType = install.get('type') == null
                                            ? '' : install.get('type').toString()
                                    if (targetType != 'machine_max:camera' && targetType != 'machine_max:sight') {
                                        problems << relative + '：变体 ' + variantName + ' 的 ' + viewpointOwnerName +
                                                ' 的视点发现目标 ' + viewTarget + ' 的类型是 ' + targetType +
                                                '——按名解析不报错，但发现结果只留视点，这条线路等于不通'
                                    }
                                    return
                                }
                                if (viewTarget.startsWith('connector.')) {
                                    if (!connectors.containsKey(viewTarget)) {
                                        problems << relative + '：变体 ' + variantName + ' 的 ' + viewpointOwnerName +
                                                ' 的视点发现目标是连接点 ' + viewTarget +
                                                '，但本变体里没有这个连接点'
                                    }
                                    return
                                }
                                problems << relative + '：变体 ' + variantName + ' 的 ' + viewpointOwnerName +
                                        ' 的视点发现目标 ' + viewTarget + ' 的写法不认识——只能写' +
                                        ' subsystem.<命名空间>.<名字>、connector.<…>、local 或 global'
                            }
                            if (discoveryBroadcast && !viewpointDiscoveryChannels.contains(discoveryChannel)) {
                                problems << relative + '：变体 ' + variantName + ' 的 ' + viewpointOwnerName +
                                        ' 的视点发现频道 ' + discoveryChannel + ' 走 local / global 广播，' +
                                        '但没有一台 camera / sight 在 discovery_inputs 里声明它——' +
                                        '接收侧按自己的接受频道筛选，这条线路永远命中不了'
                            }
                        }
                    }
                    // 第 16 节反查用：本变体的发现频道、具名目标与视点，供按模板装配体核对
                    // 「这面镜子在成车里有没有声明者」。跨 Part 的发现（座位在车体、镜在炮塔）
                    // 是合法形态，因此不能只看本零件。
                    Set<String> variantViewpointChannels = new LinkedHashSet<>()
                    Set<String> variantViewpointNames = new LinkedHashSet<>()
                    subsystems.each { Object discoveryOwnerName, Map discoveryOwner ->
                        Object discoveryRaw = discoveryOwner.get('camera_discovery_targets')
                        if (!(discoveryRaw instanceof Map)) {
                            return
                        }
                        ((Map) discoveryRaw).each { Object channelRaw, Object namesRaw ->
                            if (!(namesRaw instanceof List)) {
                                return
                            }
                            ((List) namesRaw).each { Object targetRaw ->
                                String target = targetRaw.toString()
                                if (target == 'local' || target == 'global' || target.startsWith('connector.')) {
                                    variantViewpointChannels << channelRaw.toString()
                                } else if (target.startsWith('subsystem.')) {
                                    variantViewpointNames << target
                                }
                            }
                        }
                    }
                    List<Map> variantSights = []
                    subsystems.each { Object sightName, Map sightInstall ->
                        Object sightType = sightInstall.get('type')
                        if (sightType == null) {
                            return
                        }
                        String sightTypeName = sightType.toString()
                        if (sightTypeName != 'machine_max:camera' && sightTypeName != 'machine_max:sight') {
                            return
                        }
                        variantSights << [name: sightName.toString(),
                                          accepted: acceptedChannelsOf(
                                                  (Map) acceptedChannelFields[sightTypeName], sightInstall)]
                    }
                    viewpointScopes[pack.namespace + ':' +
                            file.name.substring(0, file.name.length() - '.json'.length()) + '|' + variantName] = [
                            label            : relative,
                            channels         : variantViewpointChannels,
                            names            : variantViewpointNames,
                            sights           : variantSights]
                    // 14. 转向轮不能挤在同一根轴上
                    //
                    // CarControllerSubsystem 拿「非转向轮的平均位置」当转向中心（阿克曼几何），
                    // 轮胎转角按 atan(该轮到中心的纵向距离 / 转向半径) 求；全是转向轮时改用全部轮的
                    // 平均位置。两种取法都要求转向轴与转向中心在纵向错开：一个变体的转向轮如果全
                    // 集中在一根轴上，中心就落在那根轴上，纵向距离恒为 0、转角恒为 0——车能开能刹，
                    // 打方向却没反应，日志里什么都没有。判定与 updateSteeringCenter 同口径
                    // （|upper - lower| > 1e-4 算转向轮），纵向位置取连接点定位器在模型里的 z。
                    if (subsystems.values().any { Map install ->
                        install.get('type') != null && install.get('type').toString() == 'machine_max:car_controller'
                    }) {
                        List<Map> steeringWheels = []
                        int straightWheelCount = 0
                        subsystems.each { Object wheelName, Map wheelInstall ->
                            if (wheelInstall.get('type') == null ||
                                    wheelInstall.get('type').toString() != 'machine_max:wheel_driver') {
                                return
                            }
                            Map connectorBlock = (Map) connectors[wheelInstall.get('connector')?.toString()]
                            Map jointAttrs = jointAttrsOf(connectorBlock)
                            Object yr = jointAttrs == null ? null : jointAttrs.get('yr')
                            boolean steering = false
                            if (yr instanceof Map) {
                                Object lower = ((Map) yr).get('lower_limit')
                                Object upper = ((Map) yr).get('upper_limit')
                                if (lower instanceof Number && upper instanceof Number) {
                                    steering = Math.abs(((Number) lower).doubleValue()
                                            - ((Number) upper).doubleValue()) > 1e-4
                                }
                            }
                            if (steering) {
                                steeringWheels << [install: wheelInstall, connector: connectorBlock]
                            } else {
                                straightWheelCount++
                            }
                        }
                        if (!steeringWheels.isEmpty() && straightWheelCount == 0) {
                            // 全是转向轮时才需要看几何：这些轮子的定位器是不是挤在同一根轴上
                            Map<String, List<Double>> locators = modelLocatorsOf(variantRaw, modelLocatorCache)
                            List<Double> zs = []
                            steeringWheels.each { Map wheel ->
                                Object locatorName = wheel.connector == null ? null
                                        : ((Map) wheel.connector).get('locator')
                                List<Double> position = locatorName == null ? null
                                        : locators.get(locatorName.toString())
                                if (position != null && position.size() >= 3) {
                                    zs << position[2]
                                }
                            }
                            if (zs.size() == steeringWheels.size() && zs.size() > 1) {
                                double mean = zs.sum() / zs.size()
                                double spread = zs.collect { Math.abs(it - mean) }.max()
                                if (spread < 0.5) {
                                    problems << relative + '：变体 ' + variantName + ' 的 ' + zs.size() +
                                            ' 个轮驱动全是转向轮，且都在同一根轴附近（定位器纵向跨度 ' +
                                            String.format(Locale.ROOT, '%.2f', spread * 2) +
                                            ' 格）——车控拿轮子平均位置当转向中心，纵向距离恒为 0、转角恒为 0' +
                                            '（车能开能刹，打方向没反应）；运行时的兜底是改用车控宿主子零件的' +
                                            '质心当转向中心并打一条 WARN，质心也落在这根轴上时照样打不动，' +
                                            '能退回来的代价是转弯半径翻倍；给不转向的车轮补 wheel_driver，' +
                                            '型号的 max_drive_force 与 steering.max_force 写 0，只留制动力矩与手刹力矩'
                                }
                            }
                        }
                    }
                    connectors.each { Object connectorName, Map connector ->
                        Object targetsRaw = connector.get('signal_targets')
                        Object translationsRaw = connector.get('signal_translations')
                        if (Boolean.TRUE == connector.get('internal')) {
                            List<String> samePartTables = []
                            if (targetsRaw instanceof Map) {
                                samePartTables << 'signal_targets'
                            }
                            if (translationsRaw instanceof Map) {
                                samePartTables << 'signal_translations'
                            }
                            if (samePartTables) {
                                problems << relative + '：变体 ' + variantName + ' 的内部连接点 ' + connectorName +
                                        ' 配了 ' + samePartTables.join(' / ') +
                                        '——内部连接点两端在同一个 Part 内，把目标改成子系统名直连即可；' +
                                        '绕经它多一条几何自动配对依赖，配不上时这条线静默断开'
                            }
                        }
                        if (!(targetsRaw instanceof Map)) {
                            return
                        }
                        Map targets = (Map) targetsRaw
                        if (translationsRaw instanceof Map) {
                            ((Map) translationsRaw).each { Object original, Object translated ->
                                if (!targets.containsKey(translated)) {
                                    problems << relative + '：变体 ' + variantName + ' 的连接点 ' + connectorName +
                                            ' 把频道 ' + original + ' 转译成 ' + translated +
                                            '，但 signal_targets 里没有这个频道（对侧按转译后的名字查目标表，查不到就丢弃）'
                                }
                            }
                        }
                        targets.each { Object channelRaw, Object namesRaw ->
                            if (!(namesRaw instanceof List)) {
                                return
                            }
                            String channel = channelRaw.toString()
                            ((List) namesRaw).each { Object nameRaw ->
                                String name = nameRaw.toString()
                                Map install = subsystems[name]
                                if (install == null) {
                                    return // local / global / 连接点 / 交互区
                                }
                                String typeId = install.get('type') == null ? '' : install.get('type').toString()
                                Map fields = (Map) acceptedChannelFields[typeId]
                                if (fields == null) {
                                    return // 表里没有的类型不检查
                                }
                                Set<String> accepted = acceptedChannelsOf(fields, install)
                                if (fields.get('acceptsAllWhenEmpty') && accepted.isEmpty()) {
                                    portWireCount++
                                    return
                                }
                                portWireCount++
                                if (accepted.contains(channel)) {
                                    return
                                }
                                problems << relative + '：变体 ' + variantName + ' 的连接点 ' + connectorName +
                                        ' 把到达频道 ' + channel + ' 送给 ' + name + '（' + typeId + '），' +
                                        '但它只接受 ' + (accepted.isEmpty() ? '（空表，当前语义为不接受任何频道）' : accepted) +
                                        '——跨连接点转发会静默丢掉这条信号' +
                                        '（改 signal_translations 转译成它声明的频道，或在安装块里补声明）'
                            }
                        }
                    }
                }
            }
        }

        // 16. 视点必须有声明者（按模板装配体核对）
        //
        // 座位与武器控制器在 camera_discovery_targets 里声明「这台视点归谁」，视点自己的
        // discovery_inputs 决定它能被哪条广播频道找到。两条都对不上时这面镜子在成车里永远不进
        // 候选：切换键跳过它、提示不亮，日志里什么都没有。上一节查的是「写了发现表但指不到东西」，
        // 这里查反方向。
        //
        // 判据按装配体：一辆车由多份零件拼成，座位在车体、镜在炮塔是常见形态，所以把模板里全部
        // 零件的发现频道与具名目标并起来看。具名目标只在本零件内解析（resolveTargets 走 Part
        // 作用域），广播与连接点名按接收侧的 discovery_inputs 到达。
        //
        // 因此「只在某个加装件里声明」会在这里报出来——加装件不在模板里时，成车缺那份声明。
        templates.keySet().sort().each { String templateId ->
            Map templateEntry = (Map) templates[templateId]
            Object templateData = null
            try {
                templateData = readJsonc((File) templateEntry.file)
            } catch (Exception ignored) {
                return // 解析失败已由第 1 节报出
            }
            Object templatePartsRaw = templateData instanceof Map ? ((Map) templateData).get('parts') : null
            if (!(templatePartsRaw instanceof Map)) {
                return
            }
            Set<String> assemblyChannels = new LinkedHashSet<>()
            Map<String, Set<String>> assemblyNamed = [:]
            List<Map> assemblySights = []
            ((Map) templatePartsRaw).each { Object ignoredPartUuid, Object templatePartRaw ->
                if (!(templatePartRaw instanceof Map)) {
                    return
                }
                Object registryRaw = ((Map) templatePartRaw).get('registry_key')
                if (registryRaw == null) {
                    return
                }
                String partId = registryRaw.toString()
                Object variantRaw = ((Map) templatePartRaw).get('variant')
                String variantName = variantRaw == null ? 'default' : variantRaw.toString()
                Map scope = (Map) viewpointScopes[partId + '|' + variantName]
                if (scope == null) {
                    // 单变体零件在文件里没有变体名，模板可能写成任意名字：按零件 id 取唯一那一份
                    scope = (Map) viewpointScopes.find { it.key.toString().startsWith(partId + '|') }?.value
                }
                if (scope == null) {
                    return
                }
                assemblyChannels.addAll((Collection<String>) scope.channels)
                Set<String> named = assemblyNamed.get(partId)
                if (named == null) {
                    named = new LinkedHashSet<String>()
                    assemblyNamed[partId] = named
                }
                named.addAll((Collection<String>) scope.names)
                ((List) scope.sights).each { Map sight ->
                    assemblySights << [part: partId, label: scope.label,
                                       name: sight.name, accepted: sight.accepted]
                }
            }
            assemblySights.each { Map sight ->
                if (assemblyNamed[sight.part]?.contains(sight.name)) {
                    return
                }
                if (!((Set<String>) sight.accepted).intersect(assemblyChannels).isEmpty()) {
                    return
                }
                problems << '模板 ' + templateId + ' 的视点 ' + sight.name + '（' + sight.label + '）' +
                        '在装配体里没有声明者——没有任何座位或武器控制器在 camera_discovery_targets 里' +
                        '到达它：具名目标写 subsystem.<命名空间>.<名字>（只在本零件内解析），' +
                        '或让它接受一条装配体里已声明的广播频道。两条都落空时这面镜子永远不进候选'
                details.append('    缺声明者  模板 ').append(templateId).append(' → ')
                        .append(sight.label).append(' / ').append(sight.name).append('\n')
            }

            // 11b. 交互区跨零件事件线在模板里的落点
            //
            // 交互区把目标写成连接点名时，事件经自己的端口送到对侧：对侧先用它自己的
            // signal_translations 转译，再按它自己的 signal_targets 取目标；两张表都没有这条频道时
            // 端口静默丢弃（与值车道走同一段代码）。症状是「点得动、动画有，锁扣不解」或
            // 「提示亮着，按下什么都没发生」，日志里什么都没有。
            //
            // 判据读模板自己的 connections：两端的连接点名都由模板写下，所以能确定对侧是谁。
            // 两个方向都查——连接点两端都有 SignalPort，信号可以朝任一方向走。
            Object connectionsRaw = ((Map) templateData).get('connections')
            if (connectionsRaw instanceof List) {
                def templatePartOf = { Object uuid ->
                    if (uuid == null) return null
                    Object rawPart = ((Map) templatePartsRaw).get(uuid.toString())
                    if (!(rawPart instanceof Map)) return null
                    Object registry = ((Map) rawPart).get('registry_key')
                    if (registry == null) return null
                    Object variantRaw = ((Map) rawPart).get('variant')
                    [partId: registry.toString(), variant: variantRaw == null ? 'default' : variantRaw.toString()]
                }
                ((List) connectionsRaw).each { Object rawConnection ->
                    if (!(rawConnection instanceof Map)) return
                    Map connection = (Map) rawConnection
                    [[sender          : connection.get('partUuidS'),
                      senderConnector : connection.get('simplePointConnectorName'),
                      receiver        : connection.get('partUuidA'),
                      receiverConnector: connection.get('advConnectorName')],
                     [sender          : connection.get('partUuidA'),
                      senderConnector : connection.get('advConnectorName'),
                      receiver        : connection.get('partUuidS'),
                      receiverConnector: connection.get('simplePointConnectorName')]]
                            .each { Map flow ->
                        Map senderRef = (Map) templatePartOf(flow.sender)
                        Map receiverRef = (Map) templatePartOf(flow.receiver)
                        if (senderRef == null || receiverRef == null) return
                        String senderConnector = flow.senderConnector == null ? null : flow.senderConnector.toString()
                        String receiverConnector = flow.receiverConnector == null ? null : flow.receiverConnector.toString()
                        if (senderConnector == null || receiverConnector == null) return
                        String senderKey = senderRef.partId + '|' + senderRef.variant
                        String receiverKey = receiverRef.partId + '|' + receiverRef.variant
                        templatedParts << senderKey
                        templatedParts << receiverKey
                        templatedConnectorPairs << senderKey + '|' + senderConnector
                        templatedConnectorPairs << receiverKey + '|' + receiverConnector
                        Map senderScope = (Map) interactScopeOf(senderRef.partId, senderRef.variant)
                        if (senderScope == null) return
                        Map receiverScope = (Map) interactScopeOf(receiverRef.partId, receiverRef.variant)
                        if (receiverScope == null) return
                        ((List) senderScope.wires).each { Map wire ->
                            if (wire.connector != senderConnector) return
                            eventWireRefCount++
                            Map tables = (Map) ((Map) receiverScope.connectors).get(receiverConnector)
                            if (tables == null) {
                                problems << '模板 ' + templateId + '：交互区 ' + wire.box + '（' + senderScope.label +
                                        '）的事件线经 ' + senderConnector + ' 送到 ' + receiverRef.partId +
                                        ' 的 ' + receiverConnector + '，但那个零件没有这个连接点'
                                return
                            }
                            Object translations = tables.translations
                            String arrival = translations instanceof Map && ((Map) translations).get(wire.channel) != null
                                    ? ((Map) translations).get(wire.channel).toString() : wire.channel.toString()
                            Object targetList = tables.targets instanceof Map
                                    ? ((Map) tables.targets).get(arrival) : null
                            if (targetList instanceof List && !((List) targetList).isEmpty()) {
                                // 落在总线上的那条线是事件线：到达频道必须能对上某个控制器的事件表，
                                // 否则零件状态机按 event.<到达频道> 查不到，点击静默无事发生。
                                boolean landsOnBus = ((List) targetList).any {
                                    it != null && (it.toString() == 'local' || it.toString() == 'global')
                                }
                                if (landsOnBus && !animationEvents.contains(arrival)) {
                                    problems << '模板 ' + templateId + '：交互区 ' + wire.box + '（' + senderScope.label +
                                            '）的事件线经 ' + senderConnector + ' 到达 ' + receiverRef.partId +
                                            ' 的 ' + receiverConnector + '，到达频道是 ' + arrival +
                                            '，但没有任何动画控制器声明 event.' + arrival +
                                            '——事件在总线上没有接收者，点击只表现为没反应'
                                }
                                return
                            }
                            problems << '模板 ' + templateId + '：交互区 ' + wire.box + '（' + senderScope.label +
                                    '）的频道 ' + wire.channel + ' 经 ' + senderConnector + ' 到达 ' +
                                    receiverRef.partId + ' 的 ' + receiverConnector + ' 后没有落点——对侧没有把' +
                                    (arrival == wire.channel ? ' ' + wire.channel
                                            : ' ' + wire.channel + ' 转译成 ' + arrival) +
                                    ' 写进 signal_targets；端口按转译后的名字查表，查不到就丢弃，' +
                                    '点击时这条线上什么都不会发生（解扣 / 开合事件静默丢失）'
                        }
                    }
                }
            }
        }

        // 11b 反查：零件出现在模板里、它的跨零件事件线却一条都没被任何模板配对过。
        // 这类线在点击时发到自己的端口就断了——模板漏写那条边，装配体照常成型。
        interactScopes.each { String scopeKey, Map scope ->
            if (!templatedParts.contains(scopeKey)) {
                return
            }
            List<Map> wires = (List<Map>) scope.wires
            if (wires.isEmpty()) {
                return
            }
            if (wires.any { Map wire -> templatedConnectorPairs.contains(scopeKey + '|' + wire.connector) }) {
                return
            }
            String connectors = wires.collect { it.connector }.unique().join('、')
            problems << scope.label + '：交互区把频道送到连接点 ' + connectors +
                    '，但没有任何模板把这几个连接点配对——点击时事件发到自己的端口就断了；' +
                    '模板的 advConnectorName / simplePointConnectorName 要写出这条边'
        }

        // 12. 五类名字键的构形与译文
        //
        // 子零件 / 子系统 / 连接点 / 交互区 / 控制组的名字是**完整翻译键**，直接交给
        // Component.translatable，没有别的回退：缺一条，界面上就原样显示 `connector.machine_max.axis`
        // （装配 HUD 的低完整度连接点提示、载具信息面板、交互提示都吃这几个键）。
        //
        // 语言表按**命名空间**合并：所有提供 `<命名空间>/lang/<语言>.json` 的包（builtin、kit、
        // 车包）都贡献进同一张表，客户端只加载这一份，与 Spark-Core 的
        // LangModule.mergeCollectedContents 同口径。所以 builtin 里的通名对每个包都可见，
        // 而 `machine_max` 命名空间里的名字只写在某个车包里时，换一个只依赖 builtin 的包就查不到。
        //
        // 另一条是键的构形：名字恰好三段，名字段不含点。带点的名字（`interact.machine_max.golden.seat`）
        // 翻译系统照样解得出来，但它无法与「类别.命名空间.名字」这套规则对齐——拼写检查、词表、
        // 全局搜索都会漏掉它。
        Map<String, Map<String, Set<String>>> langKeysByNamespace = [:]
        packs.each { pack ->
            File langDir = new File(pack.dir, 'lang')
            if (!langDir.isDirectory()) {
                return
            }
            Map<String, Set<String>> perLanguage = langKeysByNamespace.computeIfAbsent(pack.namespace) {
                [:] as Map<String, Set<String>>
            }
            langDir.eachFile(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                Object data = readJsonc(file)
                if (!(data instanceof Map)) {
                    return
                }
                Set<String> keys = perLanguage.computeIfAbsent(file.name) { new HashSet<String>() }
                ((Map) data).keySet().each { Object key -> keys << key.toString() }
            }
        }
        // 控制组的名字是 `base_group.name` 与 `groups[].name`，不是文件名：预设 id 取文件名，
        // 显示名取这两个字段。子组必须一起登记——模板保存的是预设解析后的整份
        // ControlGroupSet，底组与子组都落在模板 JSON 里；只登记底组时，引用子组名的模板
        // 会被判成悬空名字（名字其实由预设声明）。`ControlGroup` 没有嵌套子组，登记一层即可。
        controlGroupPresetFiles.keySet().sort().each { String presetId ->
            Object raw = readJsonc((File) controlGroupPresetFiles[presetId])
            if (!(raw instanceof Map)) {
                return
            }
            Object baseGroup = ((Map) raw).get('base_group')
            if (baseGroup instanceof Map) {
                Object baseName = ((Map) baseGroup).get('name')
                if (baseName != null) {
                    nameDeclarations.putIfAbsent(baseName.toString(), '控制组预设 ' + presetId)
                }
            }
            Object groups = ((Map) raw).get('groups')
            if (groups instanceof List) {
                ((List) groups).each { Object group ->
                    if (group instanceof Map) {
                        Object groupName = ((Map) group).get('name')
                        if (groupName != null) {
                            nameDeclarations.putIfAbsent(groupName.toString(),
                                    '控制组预设 ' + presetId + ' 的子组')
                        }
                    }
                }
            }
        }

        def nameKeyPattern = ~/^(sub_part|subsystem|connector|interact|controlGroup)\.([^.]+)\.([^.]+)$/
        int nameKeyCount = 0
        Set<String> nameTranslationGaps = new HashSet<>()
        nameDeclarations.sort { it.key }.each { String key, String where ->
            nameKeyCount++
            def matcher = nameKeyPattern.matcher(key)
            if (!matcher.matches()) {
                problems << where + '：名字 ' + key + ' 不是 <类别>.<命名空间>.<名字> 三段' +
                        '（名字段不能再带点）'
                return
            }
            String namespace = matcher.group(2)
            Map<String, Set<String>> perLanguage = langKeysByNamespace.get(namespace)
            ['zh_cn.json', 'en_us.json'].each { String fileName ->
                Set<String> keys = perLanguage == null ? null : perLanguage.get(fileName)
                if (keys != null && keys.contains(key)) {
                    return
                }
                nameTranslationGaps << key
                problems << where + '：名字 ' + key + ' 在命名空间 ' + namespace + ' 的语言表里没有' +
                        (fileName == 'zh_cn.json' ? '中文' : '英文') + '译文' +
                        '（界面上会原样显示这个键）'
            }
        }

        // 13. 动画与模板里的名字引用
        //
        // 动画的 MoLang 用完整名字键查本部件：`local.connector_offset('connector.machine_max.left_wheel_01', 1)`
        // 查不到连接点时返回 0，悬架摆臂就不跟动；`local.subsystem_destroyed('...')` 查不到子系统时
        // 条件恒为「未摧毁」，爆反挡板永远缩着。两种都只是画面不对，没有日志。
        //
        // 变体的动画集缺省与模型同名，显式写 machine_max:empty 表示没有动画集。集合按「忽略前导目录
        // 的目录名」匹配（machine_max:ae86 命中 animations/ 下目录名为 ae86 的所有动画文件）；一份动画
        // 可能被同一装配体的多个变体共用，每个变体只认自己有的连接点，所以按引用方的名字并集核对；
        // 没有变体引用的动画（HUD 动画）不查。
        Map<String, Set<String>> animationScopes = [:]
        variantScopes.each { Map scope ->
            if (scope.animation) {
                animationScopes.computeIfAbsent(scope.animation as String) { new LinkedHashSet<String>() }
                        .addAll(scope.names as Set<String>)
            }
        }
        int animationNameRefCount = 0
        packs.each { pack ->
            File animationsDir = new File(pack.dir, 'animations')
            if (!animationsDir.isDirectory()) {
                return
            }
            animationsDir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.animation.json')) {
                    return
                }
                Set<String> scopeNames = new LinkedHashSet<>()
                pack.dir.toPath().relativize(file.toPath()).each { Object segment ->
                    Set<String> names = animationScopes.get(segment.toString())
                    if (names != null) {
                        scopeNames.addAll(names)
                    }
                }
                if (scopeNames.isEmpty()) {
                    return
                }
                List<String> referenced = []
                collectNameRefs(file.getText('UTF-8'), referenced)
                referenced.unique().each { String ref ->
                    animationNameRefCount++
                    if (scopeNames.contains(ref)) {
                        return
                    }
                    problems << pack.name + '/' + pack.dir.toPath().relativize(file.toPath())
                            .toString().replace(File.separatorChar, '/' as char) +
                            '：动画引用的名字 ' + ref + ' 不在引用它的变体里' +
                            '（MoLang 查询恒为 0，动画不跟动且没有日志）'
                }
            }
        }
        // 模板把各零件的连接点配成一条线（advConnectorName / simplePointConnectorName），
        // 名字写错时这一对配不上，装配体少一组约束，车开到一半才散架。
        int templateNameRefCount = 0
        packs.each { pack ->
            File templatesDir = new File(pack.dir, 'templates')
            if (!templatesDir.isDirectory()) {
                return
            }
            templatesDir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                List<String> referenced = []
                collectNameRefs(file.getText('UTF-8'), referenced)
                referenced.unique().each { String ref ->
                    templateNameRefCount++
                    if (nameDeclarations.containsKey(ref)) {
                        return
                    }
                    problems << pack.name + '/' + pack.dir.toPath().relativize(file.toPath())
                            .toString().replace(File.separatorChar, '/' as char) +
                            '：模板引用的名字 ' + ref + ' 不在任何内容包里' +
                            '（这条连接配不上，装配体少一组约束）'
                }
            }
        }

        // 10. 履带临时配方与型号对齐
        //
        // 履带物品只有一个 machine_max:track，型号写在合成结果的 result.components 里
        // （ShapedRecipe 用 ItemStack.STRICT_CODEC 解 result，组件随之进产物）。这里查两个方向：
        // 每条配方指向的型号真实存在且是履带，每个第一方履带型号都有配方。
        // 这批判配方是临时的：内容包的正式履带节配方落地时，它与本节一起删掉。
        Map<String, List<String>> trackTypes = [:]
        packs.each { pack ->
            File dir = new File(pack.dir, 'fittings')
            if (!dir.isDirectory()) {
                return
            }
            dir.eachFileRecurse(FileType.FILES) { File file ->
                if (!file.name.toLowerCase(Locale.ROOT).endsWith('.json')) {
                    return
                }
                String relative = pack.dir.toPath().relativize(file.toPath()).toString()
                        .replace(File.separatorChar, '/' as char)
                Object fitting
                try {
                    fitting = readJsonc(file)
                } catch (Exception ignored) {
                    return
                }
                if (fitting instanceof Map && ((Map) fitting).get('type') == 'track') {
                    String id = pack.namespace + ':' + file.name.substring(0, file.name.length() - 5)
                    trackTypes[id] = (trackTypes[id] ?: []) + [pack.name + '/' + relative]
                }
            }
        }

        File fittingRecipeDir = new File(contentProjectDir, 'src/main/resources/data/machine_max/recipe/fittings')
        Map<String, String> recipeByTrackType = [:]
        int trackRecipeCount = 0
        List<File> trackRecipeFiles = fittingRecipeDir.isDirectory()
                ? fittingRecipeDir.listFiles()
                        .findAll { it.isFile() && it.name.toLowerCase(Locale.ROOT).endsWith('.json') }
                        .sort { it.name }
                : []
        trackRecipeFiles.each { File file ->
            String label = 'data/machine_max/recipe/fittings/' + file.name
            String text = file.getText('UTF-8')
            if (stripJsonc(text) != text) {
                problems << label + '：含注释或尾逗号（data/ 下的配方按严格 JSON 读，' +
                        '整份文件会被跳过，配方等于不存在）'
            }
            Object raw
            try {
                raw = new JsonSlurper().parseText(text)
            } catch (Exception e) {
                problems << label + '：不是合法 JSON（' + e.message + '）'
                return
            }
            if (!(raw instanceof Map)) {
                problems << label + '：顶层不是对象'
                return
            }
            Map recipe = (Map) raw
            String kind = recipe.get('type') == null ? '' : recipe.get('type').toString()
            if (kind != 'minecraft:crafting_shaped' && kind != 'minecraft:crafting_shapeless') {
                problems << label + '：type 是 ' + kind + '，只接受原版有序 / 无序合成'
                return
            }
            if (kind == 'minecraft:crafting_shaped') {
                Object pattern = recipe.get('pattern')
                Object key = recipe.get('key')
                if (!(pattern instanceof List) || !(key instanceof Map)) {
                    problems << label + '：有序合成缺 pattern 或 key'
                    return
                }
                Set<String> symbols = ((Map) key).keySet()*.toString() as Set<String>
                Set<String> unknown = new LinkedHashSet<>()
                ((List) pattern).each { Object row ->
                    row.toString().each { String symbol ->
                        if (symbol != ' ' && !symbols.contains(symbol)) {
                            unknown << symbol
                        }
                    }
                }
                if (unknown) {
                    problems << label + '：pattern 用了 key 里没有的符号 ' + unknown.join('、') +
                            '（解码期报错，整条配方读不出来）'
                }
                int width = pattern.isEmpty() ? 0 : pattern[0].toString().length()
                if (pattern.size() > 3 || width > 3) {
                    problems << label + '：pattern 是 ' + pattern.size() + ' 行 × ' + width +
                            ' 列，超出 3×3'
                }
            }
            Object rawResult = recipe.get('result')
            if (!(rawResult instanceof Map)) {
                problems << label + '：缺 result'
                return
            }
            Map result = (Map) rawResult
            if (result.get('id') != 'machine_max:track') {
                problems << label + '：产物是 ' + result.get('id') + '，不是履带物品 machine_max:track'
                return
            }
            Object count = result.get('count')
            if (!(count instanceof Number) || ((Number) count).intValue() < 1 || ((Number) count).intValue() > 64) {
                problems << label + '：一次合成 ' + count + ' 节，不在 1..64（TrackItem 的 stacksTo(64)）'
            }
            Object rawComponents = result.get('components')
            Object rawTrackType = rawComponents instanceof Map
                    ? ((Map) rawComponents).get('machine_max:fitting_type')
                    : null
            if (rawTrackType == null) {
                problems << label + '：result.components 里没有 machine_max:fitting_type，' +
                        '合成出来的是缺型号的回落物品'
                return
            }
            String trackTypeId = rawTrackType.toString()
            if (!trackTypes.containsKey(trackTypeId)) {
                problems << label + '：型号 ' + trackTypeId + ' 不是内容包里的履带型号' +
                        '（要找 type 为 track 的 fittings/<名>.json）'
                return
            }
            String previous = recipeByTrackType.put(trackTypeId, label)
            if (previous != null) {
                problems << label + '：与 ' + previous + ' 都产出 ' + trackTypeId + '，合成台只会用其中一条'
                return
            }
            trackRecipeCount++
        }
        (trackTypes.keySet() - recipeByTrackType.keySet()).sort().each { String id ->
            problems << '履带型号 ' + id + ' 没有配方（' + trackTypes[id].join('、') + '）：在生存里拿不到它的履带节'
        }

        packs.each { pack ->
            int ownTemplates = templates.values().count { it.pack == pack.name }
            int ownAssemblies = assemblies.values().count { it.pack == pack.name }
            int ownBlueprints = blueprints.values().count { it.pack == pack.name }
            int ownControlGroups = controlGroupPresets.values().count { it == pack.name }
            logger.quiet('  ok  ' + pack.name + '/' + pack.namespace + '：模板 ' + ownTemplates +
                    '，装配体 ' + ownAssemblies + '，载具蓝图 ' + ownBlueprints +
                    '，控制组预设 ' + ownControlGroups)
        }
        if (pendingTooltips) {
            logger.quiet('  提示 ' + pendingTooltips.size() + ' 处 tooltip 引用的 html 还没有文件' +
                    '（缺了只是蓝图没有说明文字，不影响放置）：')
            details.toString().readLines()
                    .findAll { it.startsWith('    缺页面') }
                    .each { logger.quiet(it) }
        }

        if (problems) {
            def text = details.toString().readLines().join('\n')
            throw new GradleException('内容包引用检查未通过：\n  ' + problems.join('\n  ') +
                    (text ? '\n' + text : ''))
        }
        logger.quiet('内容包引用检查通过（' + templates.size() + ' 份模板 / ' + assemblies.size() +
                ' 份装配体 / ' + blueprints.size() + ' 份蓝图，' + partDefinitionCount + ' 份部件定义 / ' +
                partVariantCount + ' 份变体（三类名字无重名、无保留地址），' + portWireCount + ' 条跨连接点信号线（到达频道都在目标声明内，且没有一条挂在内部连接点上），' +
                interactTargetCount + ' 条交互区目标（都是本变体内的子系统或连接点，同一条频道不兼指 local 与 global），' +
                eventWireRefCount + ' 条交互区跨零件事件线（模板配对的对侧都能投出去，且到达频道都对得上控制器事件），' +
                viewpointDiscoveryTargetCount + ' 条视点发现目标（取值域在本变体内，广播频道都有视点声明），' +
                referenceCount + ' 处资源引用，' +
                documentReferenceCount + ' 处样式表引用，' +
                particleReferenceCount + ' 处材质粒子引用，' + childParticleCount + ' 处子效果引用，' +
                soundReferenceCount + ' 处音效事件引用（' + soundEvents.size() + ' 个已注册事件），' +
                presetReferenceCount + ' 处座位控制组引用（' + controlGroupPresets.size() + ' 份预设），' +
                priorityKeyCount + ' 条越级量键，' + nameKeyCount + ' 个名字键（' +
                nameTranslationGaps.size() + ' 条缺译），' + animationNameRefCount +
                ' 处动画名字引用、' + templateNameRefCount + ' 处模板名字引用，' + languageKeyCount + ' 条语言键（' +
                untranslatedValueCount + ' 条中文缺译），' +
                trackRecipeCount + ' 条履带临时配方（' + trackTypes.size() + ' 个型号全覆盖））。')
    }
}

if (tasks.findByName('check') != null) {
    tasks.named('check').configure { dependsOn tasks.named('checkContent') }
}
