pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    plugins {
        id 'org.jetbrains.kotlin.jvm' version '2.0.0'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Machine-Max'

if (providers.gradleProperty('mmUseUpstreamSources').map { it.toBoolean() }.getOrElse(false)) {
    println('[Machine-Max] Using upstream source builds (mmUseUpstreamSources=true)')
} else {
    println('[Machine-Max] Using published/local upstream binaries (set -PmmUseUpstreamSources=true to include source builds)')
    return
}

def sparkCoreDir = file("${spark_core_dir}") // 此处修改为Spark-Core源码所在目录
if (!sparkCoreDir.isDirectory()) throw new GradleException('mmUseUpstreamSources=true but Spark-Core source is missing')
if (sparkCoreDir.exists()) { // 首选同目录下Spark-Core源码作为依赖
    includeBuild(sparkCoreDir) {
        dependencySubstitution {
            substitute(module("io.github.solarmoonqaq:spark-core-${mod_loader}"))
                    .using(project(":"))
        }
    }
} else { // 若不存在，则使用发布的/本地jar作为依赖
    println("[Machine-Max] Spark-Core not found, using published/local jar")
}

def ballisticsFrameworkDir = file("${ballistics_framework_dir}") // 弹道框架源码目录
if (!ballisticsFrameworkDir.isDirectory()) throw new GradleException('mmUseUpstreamSources=true but BallisticsFramework source is missing')
if (ballisticsFrameworkDir.exists()) { // 首选同目录下弹道框架源码作为依赖
    includeBuild(ballisticsFrameworkDir) {
        dependencySubstitution {
            substitute(module("io.github.sweetzonzi:ballistics_framework-${minecraft_version}-${mod_loader}"))
                    .using(project(":"))
        }
    }
} else { // 若不存在，则使用发布的/本地jar作为依赖
    println("[Machine-Max] BallisticsFramework not found, using published/local jar")
}
