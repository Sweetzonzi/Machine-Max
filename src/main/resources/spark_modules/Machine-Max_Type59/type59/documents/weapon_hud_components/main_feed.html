<!doctype html>
<html lang="en">
<head><meta name="aui-preload">
  <meta charset="utf-8">
  <meta name="aui-viewport" content="mode=browser; width=1600; user-scalable=false">
  <title>59式 100 mm</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <div class="weapon-component" data-mm-class="weapon.selected ? 'selected' : 'unselected'">
    <div class="hud-panel grain-feed" data-mm-class="weapon.state">
    <div class="identity"><span class="level"><translation>hud.type59.feed</translation></span><b><translation>hud.type59.main_name</translation></b></div>
    <div class="tubes">
      <div class="tube-row" data-mm-repeat="weapon.tubes" data-mm-class="tube.state">
        <i class="row-fill" data-mm-num="tube.loading_progress * 100" data-mm-var="--fill" data-mm-unit="%"></i>
        <i class="regen-fill" data-mm-class="tube.supply_refill_phase" data-mm-num="tube.supply_refill_progress * 100" data-mm-var="--regen-fill" data-mm-unit="%"></i>
        <div class="tube-line"><span class="tube-number" data-mm-text="tube.index + 1">--</span><span class="round-label" data-mm-text="tube.round_label">--</span><div class="loading-source" data-mm-class="tube.loading_phase"><span><translation>hud.type59.loading</translation></span><span data-mm-text="tube.loading_source_label">--</span></div><b class="row-time"><translation data-mm-text="tube.state == 'ready' ? 'hud.type59.ready' : (tube.state == 'empty' ? 'hud.type59.empty' : (tube.loading_phase != 'idle' ? tube.loading_time_text : 'WAIT'))">--</translation></b></div>
        <div class="regen-status"><span>AMMO /</span><span class="regen-time" data-mm-text="tube.supply_refill_phase != 'idle' ? tube.supply_refill_time_text : 'READY'">--</span></div>
      </div>
    </div>
    <div class="belts">
      <div class="belt-row" data-mm-repeat="weapon.ammo_options" data-mm-class="ammo_option.selected ? 'selected' : 'unselected'">
        <div class="belt-line"><span class="selection-pointer">&gt;</span><span class="belt-label" data-mm-text="ammo_option.label">--</span><span class="belt-stock"><span data-mm-text="ammo_option.reserve_remaining">--</span>/<span data-mm-text="ammo_option.reserve_infinite ? '∞' : ammo_option.reserve_capacity">--</span></span></div>
      </div>
    </div>
    <div class="scanlines" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
