<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="aui-preload">
  <meta charset="utf-8">
  <meta name="aui-viewport" content="mode=browser; width=1600; user-scalable=false">
  <title>Modern Optics / Durability</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <div class="mm-durability" role="img" aria-label="车体耐久" data-mm-class="global.max_hp ? 'known' : 'unknown'">
    <div class="mm-dur-caption">
      <span class="mm-dur-label">HULL</span>
      <span class="mm-dur-value"><span data-mm-text="global.max_hp ? math.floor(global.hp) : '--'">--</span>/<span data-mm-text="global.max_hp ? math.floor(global.max_hp) : '--'">--</span></span>
    </div>
    <div class="mm-dur-bar" aria-hidden="true">
      <div class="mm-dur-track">
        <div class="mm-dur-seg"></div><div class="mm-dur-seg"></div><div class="mm-dur-seg"></div><div class="mm-dur-seg"></div>
        <div class="mm-dur-seg"></div><div class="mm-dur-seg"></div><div class="mm-dur-seg"></div><div class="mm-dur-seg"></div>
        <div class="mm-dur-seg"></div><div class="mm-dur-seg"></div><div class="mm-dur-seg"></div><div class="mm-dur-seg"></div>
      </div>
      <!-- AUI 的标签扫描在第一个 > 处截断，data-mm 表达式里不要写 >。 -->
      <div class="mm-dur-fill" data-mm-num="global.max_hp ? math.clamp(global.hp / global.max_hp * 100, 0, 100) : 0" data-mm-var="--dur" data-mm-unit="%"><span class="mm-dur-probe" data-mm-text="global.max_hp ? math.floor(global.hp / global.max_hp * 1000) : 0" aria-hidden="true">0</span></div>
    </div>
  </div>
</body>
</html>
