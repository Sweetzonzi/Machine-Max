<!doctype html>
<html lang="en">
<head>
  <meta name="aui-preload">
  <meta charset="utf-8">
  <meta name="aui-viewport" content="mode=browser; width=1600; user-scalable=false">
  <title>Weapon HUD / compact</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <div class="weapon-component" data-mm-class="weapon.selected ? 'selected' : 'unselected'">
    <div class="hud-panel grain-compact" data-mm-class="weapon.state">
    <div class="compact-head"><span data-mm-text="weapon.name">--</span><div class="compact-count"><b data-mm-text="weapon.loaded_rounds">--</b><span>/</span><b data-mm-text="weapon.reserve_remaining">--</b></div></div>
    <div class="compact-subline">
      <div class="compact-status" data-mm-repeat="weapon.tubes"><span class="compact-status-label" data-mm-class="tube.loading_phase">LOAD</span><b data-mm-text="tube.state == 'ready' ? 'RDY' : (tube.state == 'empty' ? 'EMPTY' : (tube.loading_phase != 'idle' ? tube.loading_time_text : 'WAIT'))">RDY</b></div>
      <div class="compact-regen" data-mm-repeat="weapon.tubes" data-mm-class="tube.supply_refill_phase != 'idle' ? tube.supply_refill_phase : (tube.source_reserve_capacity > 0 ? (tube.source_reserve_remaining >= tube.source_reserve_capacity ? 'full' : 'idle') : 'idle')"><span class="compact-regen-label compact-regen-single">RESERVE +1</span><span class="compact-regen-label compact-regen-batch"><span>RESERVE +</span><b data-mm-text="tube.source_reserve_capacity">--</b></span><span class="compact-regen-label compact-regen-full">FULL</span><span class="compact-regen-track"><i data-mm-num="tube.supply_refill_phase == 'idle' ? (tube.source_reserve_capacity > 0 ? tube.source_reserve_remaining / tube.source_reserve_capacity * 100 : 0) : tube.supply_refill_progress * 100" data-mm-var="--regen-fill" data-mm-unit="%"></i></span><span class="compact-regen-time" data-mm-text="tube.supply_refill_phase != 'idle' ? tube.supply_refill_time_text : ''"></span></div>
    </div>
    <div class="compact-loading" data-mm-repeat="weapon.tubes" data-mm-class="tube.loading_phase == 'idle' ? 'idle' : 'loading'"><i data-mm-num="tube.loading_progress * 100" data-mm-var="--loading-fill" data-mm-unit="%"></i></div>
    <div class="scanlines" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
