<!doctype html>
<html>
<head>
  <meta name="aui-preload">
  <meta charset="utf-8">
  <style>
    .weapon { width: 260px; padding: 12px; color: var(--mm-accent, #a4ff80); background: #142027df; font-size: 14px; }
    .head, .belt { display: flex; gap: 8px; justify-content: space-between; }
    .tubes, .belts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .track { height: 3px; background: #ffffff30; }
    .track i { display: block; height: 3px; width: var(--fill); background: var(--mm-accent, #a4ff80); }
    .regen-meter { display: flex; align-items: center; gap: 5px; height: 12px; visibility: hidden; font-size: 9px; line-height: 10px; }
    .regen-meter.is-regenerating, .regen-meter.is-refilling { visibility: visible; }
    .regen-label, .regen-time { flex: none; white-space: nowrap; }
    .regen-track { flex: 1; height: 2px; background: #ffffff30; }
    .regen-track i { display: block; height: 100%; width: var(--regen-fill); background: var(--mm-accent, #a4ff80); }
    .belt-readout { display: flex; gap: 6px; justify-content: space-between; }
    .belt-readout.is-absent { display: none; }
    .is-empty { opacity: 0.45; }
  </style>
</head>
<body>
  <div class="weapon" data-mm-class="weapon.state">
    <div class="head"><b data-mm-text="weapon.name"></b><span data-mm-text="weapon.state_text"></span></div>
    <div data-mm-text="weapon.round_label"></div>
    <div class="tubes">
      <div class="tube" data-mm-repeat="weapon.tubes" data-mm-class="tube.state">
        <div class="head"><span data-mm-text="tube.round_label"></span><span data-mm-text="tube.loading_time_text"></span></div>
        <div class="belt-readout" data-mm-class="tube.has_belt || tube.chambered ? 'present' : 'absent'"><span>LOAD / <b data-mm-text="tube.has_belt ? tube.belt_label : tube.chambered_ammo_label"></b></span><span data-mm-text="tube.loaded_rounds"></span></div>
        <div class="track"><i data-mm-num="tube.loading_progress * 100" data-mm-var="--fill" data-mm-unit="%"></i></div>
        <div class="regen-meter" data-mm-class="tube.supply_refill_phase"><span class="regen-label">RESERVE +1</span><span class="regen-track"><i data-mm-num="tube.supply_refill_progress * 100" data-mm-var="--regen-fill" data-mm-unit="%"></i></span><span class="regen-time" data-mm-text="tube.supply_refill_phase != 'idle' ? tube.supply_refill_time_text : ''"></span></div>
      </div>
    </div>
    <div class="belts">
      <div class="belt" data-mm-repeat="weapon.ammo_options">
        <span data-mm-text="ammo_option.label"></span><span><span data-mm-text="ammo_option.reserve_remaining"></span>/<span data-mm-text="ammo_option.reserve_infinite ? '∞' : ammo_option.reserve_capacity"></span></span>
      </div>
    </div>
  </div>
</body>
</html>
