<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="aui-preload">
  <meta charset="utf-8">
  <meta name="aui-viewport" content="mode=browser; width=1600; user-scalable=false">
  <title>Vehicle seat list</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <div class="vehicle-hud seat-list" data-mm-class="vehicle.seat_map_visible ? 'visible' : 'hidden'">
    <div class="crew-heading"><span>CREW</span><span data-mm-text="vehicle.seat_count">--</span></div>
    <div class="crew-list">
      <div class="crew-row" data-mm-repeat="vehicle.seats" data-mm-class="seat.state">
        <span class="crew-marker" data-mm-text="seat.current ? '▸' : (seat.next ? '»' : (seat.occupied ? '•' : (seat.available ? '○' : '×')))">○</span>
        <span class="crew-number" data-mm-text="seat.number">--</span>
        <span class="crew-seat" data-mm-text="seat.name">--</span>
        <span class="crew-player" data-mm-text="seat.occupied ? (seat.entity_name == '' ? '…' : seat.entity_name) : '---'">---</span>
      </div>
    </div>
    <div class="seat-identity">
      <span class="self-label"><i></i><translation>seat_map.legend.you</translation></span>
      <span class="current-name" data-mm-text="vehicle.seat_name(vehicle.current_seat_number)">--</span>
      <span class="seat-number" data-mm-text="vehicle.current_seat_number">--</span>
    </div>
    <div class="switch-line" data-mm-class="vehicle.pending_seat_number ? 'pending' : (vehicle.next_seat_number ? 'ready' : 'full')">
      <span class="keycap" data-mm-text="vehicle.seat_switch_key">--</span>
      <span class="switch-arrow">»</span>
      <span class="switch-target" data-mm-text="vehicle.pending_seat_number ? vehicle.seat_name(vehicle.pending_seat_number) : vehicle.seat_name(vehicle.next_seat_number)">--</span>
      <translation class="switch-full">message.machine_max.seat.full</translation>
      <span class="pending-label">…</span>
    </div>
    <div class="seat-legend">
      <span class="current"><i></i><translation>seat_map.legend.you</translation></span>
      <span class="next"><i></i><translation>seat_map.legend.next</translation></span>
      <span class="empty"><i></i><translation>seat_map.legend.empty</translation></span>
      <span class="occupied"><i></i><translation>seat_map.legend.busy</translation></span>
    </div>
  </div>
</body>
</html>
