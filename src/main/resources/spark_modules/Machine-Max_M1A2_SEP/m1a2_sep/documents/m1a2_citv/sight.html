<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="aui-viewport" content="mode=browser; width=1600; user-scalable=false"><title>M1A2 CITV independent viewer</title><link rel="stylesheet" href="sight.css"></head>
<body><div class="citv">
 <div class="top-line"><span>CITV</span><span class="zoom"><span data-mm-text="math.floor(math.round(hud.current_zoom * 10) / 10)"></span>.<span data-mm-text="math.mod(math.round(hud.current_zoom * 10), 10)"></span>X</span></div>
 <div class="reticle" role="img" aria-label="CITV green stepped observation reticle">
  <div class="line left-outer"></div>  <div class="line left-upper"></div>  <div class="line left-inner"></div>  <div class="line left-lower"></div>  <div class="line right-inner"></div>  <div class="line right-upper"></div>  <div class="line right-lower"></div>  <div class="line right-outer"></div>  <div class="line upper-post"></div>  <div class="line upper-stem"></div>  <div class="line lower-stem"></div>  <div class="line lower-post"></div>
<div class="center-square"></div><div class="aim-dot"></div>
 </div>
 <div class="manual-mode">MAN</div>
 <div class="heading"><span>AZ</span><span data-mm-text="math.mod(math.round(hud.view_heading_deg) + 360, 360)"></span><span>°</span></div>
 <div class="range-panel"><div class="range-value">----</div><div class="range-unavailable">NO RANGE</div></div>
</div></body></html>
