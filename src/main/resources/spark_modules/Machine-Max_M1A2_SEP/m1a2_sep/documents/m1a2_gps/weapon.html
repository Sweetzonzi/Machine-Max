<!doctype html>
<html lang="en"><head>
<meta name="aui-preload"><meta charset="utf-8"><meta name="aui-viewport" content="mode=browser; width=1600; user-scalable=false"><title>M1A2 main gun status</title><link rel="stylesheet" href="sight.css"></head>
<body><div class="weapon-status"><div class="bdc" data-mm-class="hud.current_zoom &gt;= 9 ? (weapon.bdc_hold_rad(2500) &gt; 0 ? 'valid' : 'invalid') : 'hidden'"><div class="bdc-mark" data-mm-num="800 * hud.screen_height / math.max(hud.screen_width, 1) * math.tan(weapon.bdc_hold_rad(500) * 57.295779513) / math.tan(math.max(hud.fov_deg, 0.01) / 2)" data-mm-var="--drop" data-mm-unit="px"><i class="notch"></i><b>500</b></div>
<div class="bdc-mark" data-mm-num="800 * hud.screen_height / math.max(hud.screen_width, 1) * math.tan(weapon.bdc_hold_rad(1000) * 57.295779513) / math.tan(math.max(hud.fov_deg, 0.01) / 2)" data-mm-var="--drop" data-mm-unit="px"><i class="notch"></i><b>1000</b></div>
<div class="bdc-mark" data-mm-num="800 * hud.screen_height / math.max(hud.screen_width, 1) * math.tan(weapon.bdc_hold_rad(1500) * 57.295779513) / math.tan(math.max(hud.fov_deg, 0.01) / 2)" data-mm-var="--drop" data-mm-unit="px"><i class="notch"></i><b>1500</b></div>
<div class="bdc-mark" data-mm-num="800 * hud.screen_height / math.max(hud.screen_width, 1) * math.tan(weapon.bdc_hold_rad(2000) * 57.295779513) / math.tan(math.max(hud.fov_deg, 0.01) / 2)" data-mm-var="--drop" data-mm-unit="px"><i class="notch"></i><b>2000</b></div>
<div class="bdc-mark" data-mm-num="800 * hud.screen_height / math.max(hud.screen_width, 1) * math.tan(weapon.bdc_hold_rad(2500) * 57.295779513) / math.tan(math.max(hud.fov_deg, 0.01) / 2)" data-mm-var="--drop" data-mm-unit="px"><i class="notch"></i><b>2500</b></div><div class="bdc-legend">m</div></div>
 <div class="gun-status"><div class="status-label">GUN</div><div data-mm-repeat="weapon.tubes" data-mm-class="tube.state"><div class="status-row"><b data-mm-text="tube.chambered_ammo_label"></b><span data-mm-text="tube.reload_text"></span></div><div class="status-state" data-mm-text="tube.state == 'ready' ? 'READY' : (tube.state == 'empty' ? 'EMPTY' : 'LOADING')"></div></div><div class="progress"><i data-mm-num="weapon.tube_fill(0)" data-mm-var="--fill" data-mm-unit="%"></i></div></div>
 <div class="feed-status"><div class="status-label">FEED / RESERVE</div><div class="feed" data-mm-repeat="weapon.belts" data-mm-class="belt.selected ? 'selected' : 'unselected'"><span class="selector">›</span><span data-mm-text="belt.label"></span><b data-mm-text="belt.remaining"></b></div></div>
 <div class="ready-cue" role="img" aria-label="Main gun round ready" data-mm-class="weapon.tube_state(0)"></div>
 <div class="pending" data-mm-class="weapon.round_mismatch ? 'show' : 'hide'">NEXT FEED ≠ CHAMBER</div>
</div></body></html>
