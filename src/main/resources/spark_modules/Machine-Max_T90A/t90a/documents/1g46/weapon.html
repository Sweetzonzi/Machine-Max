<!doctype html>
<html lang="ru">
<head>
  <meta name="aui-preload">
  <meta charset="utf-8">
  <meta name="aui-viewport" content="mode=browser; width=1600; user-scalable=false">
  <title>1G46 weapon indicators</title>
  <link rel="stylesheet" href="sight.css">
</head>
<body>
  <div class="viewport" data-mm-num="1600 * hud.screen_height / math.max(hud.screen_width, 1)" data-mm-var="--screen-height" data-mm-unit="px">
    <div class="readout">
      <div class="chamber" data-mm-repeat="weapon.tubes" data-mm-class="tube.state">
        <i class="ready-lamp"></i>
        <b class="ammo" data-mm-text="tube.chambered_ammo_label"></b>
        <span class="range">— — — —</span>
      </div>
      <div class="game-feed">
        <span class="belt" data-mm-repeat="weapon.ammo_options" data-mm-class="ammo_option.selected ? 'selected' : 'unselected'"><span data-mm-text="ammo_option.label"></span> <b><span data-mm-text="ammo_option.reserve_remaining"></span>/<span data-mm-text="ammo_option.reserve_infinite ? '∞' : ammo_option.reserve_capacity"></span></b></span>
        <span class="load" data-mm-repeat="weapon.tubes" data-mm-class="tube.state">
          <span class="ready-text">ГОТОВ</span>
          <span class="empty-text">EMPTY</span>
          <span class="reload-text" data-mm-text="tube.loading_phase == 'idle' ? 'WAIT' : tube.loading_time_text"></span>
          <span class="regen-status" data-mm-class="tube.supply_refill_phase"><span class="regen-label">RESERVE +1</span><span class="regen-track"><i data-mm-num="tube.supply_refill_progress * 100" data-mm-var="--regen-fill" data-mm-unit="%"></i></span><span class="regen-time" data-mm-text="tube.supply_refill_phase != 'idle' ? tube.supply_refill_time_text : ''"></span></span>
        </span>
      </div>
      <div class="pending" data-mm-class="weapon.chambered_round_mismatch ? 'show' : 'hide'">NEXT ≠ CHAMBER</div>
    </div>
  </div>
</body>
</html>
