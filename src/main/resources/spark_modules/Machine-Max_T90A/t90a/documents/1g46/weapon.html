<!doctype html><html lang="ru"><head>
  <meta name="aui-preload"><meta charset="utf-8"><meta name="aui-viewport" content="mode=browser; width=1600; user-scalable=false"><title>1G46 weapon indicators</title><link rel="stylesheet" href="sight.css"></head><body><div class="viewport" data-mm-num="1600 * hud.screen_height / math.max(hud.screen_width, 1)" data-mm-var="--screen-height" data-mm-unit="px"><div class="readout"><div class="chamber" data-mm-repeat="weapon.tubes" data-mm-class="tube.state"><i class="ready-lamp"></i><b class="ammo" data-mm-text="tube.chambered_ammo_label"></b><span class="range">— — — —</span></div><div class="game-feed"><span class="belt" data-mm-repeat="weapon.belts" data-mm-class="belt.selected ? 'selected' : 'unselected'"><span data-mm-text="belt.label"></span> <b data-mm-text="belt.remaining"></b></span><span class="load" data-mm-repeat="weapon.tubes" data-mm-class="tube.state"><span class="ready-text">ГОТОВ</span><span class="empty-text">EMPTY</span><span class="reload-text" data-mm-text="tube.reload_text"></span></span></div><div class="pending" data-mm-class="weapon.round_mismatch ? 'show' : 'hide'">NEXT ≠ CHAMBER</div></div></div></body></html>
