<style>
    body {
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        font-family: lxgw;
        color: #ece6dc;
        font-size: 14px;
    }

    .screen {
        display: flex;
        flex-direction: column;
        width: 280px;
        height: 210px;
        padding: 12px;
        gap: 8px;
        background-color: rgba(20, 16, 12, 0.92);
        border: 1px solid #5f5348;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .title {
        height: 18px;
        line-height: 18px;
        color: #ffe9c3;
        font-size: 15px;
        text-align: center;
        border-bottom: 1px solid #3d352d;
        padding-bottom: 8px;
    }

    .info-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 4px 0;
    }

    .section {
        padding: 6px 8px;
        background-color: rgba(83, 72, 63, 0.25);
        border: 1px solid #3d352d;
    }

    .label {
        color: #8a7e6e;
        font-size: 10px;
    }

    .value {
        color: #ece6dc;
        font-size: 12px;
    }

    .player-panel {
        width: 100%;
        border: 1px solid #3d352d;
        background-color: rgba(83, 72, 63, 0.2);
        padding: 4px;
    }

    .player-panel slot {
        width: 16px;
        height: 16px;
    }

    .player-label {
        color: #8a7e6e;
        font-size: 9px;
        margin-bottom: 2px;
    }
</style>

<body>
<div class="screen">
    <div class="title">车辆信息</div>

    <container id="info-panel" bind="__virtual_ui">
        <div class="info-grid">
            <div class="section">
                <div class="label">车辆名称</div>
                <div class="value" id="vehicle-name">---</div>
            </div>

            <div class="section">
                <div class="label">当前速度</div>
                <div class="value" id="vehicle-speed">0 km/h</div>
            </div>

            <div class="section">
                <div class="label">控制模式</div>
                <div class="value" id="vehicle-mode">-</div>
            </div>
        </div>
    </container>

    <container class="player-panel" id="backpack" bind="player" layout="preset:player">
        <div class="player-label">背包</div>
        <slot mode="bound" repeat="36" slot-index="0"></slot>
    </container>
</div>
</body>
