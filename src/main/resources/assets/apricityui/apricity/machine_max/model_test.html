<!--
  AUI 自定义元素测试页 —— 在页面里渲染游戏内的部件 3D 模型。

  标签 <machinemax-part-model> 由 PartModelElement 提供：
  初始化时用硬编码的 machine_max:wine_fox_hull 取出 PartType，
  构造独立的 PartAnimatable，再逐骨骼调用 ModelRenderHelperKt.render 绘制。
  模型尺寸由元素当前的内容区尺寸推导，所以布局变化后模型会自动跟随。

  打开方式：按 F10 打开 AUI 内置资源管理器，在资源树里找到
  machine_max/model_test.html，双击即可开出可交互预览窗口。
-->
<style>
  /* 全部用流式尺寸：窗口变化时盒子跟着变，模型由元素按盒子的短边自行换算缩放 */
  .test-root {
    margin: 16px;
    padding: 16px;
    background-color: #0d1117;
    border: 1px solid #2a3340;
  }

  .test-title {
    font-size: 18px;
    color: #e6edf3;
    margin-bottom: 4px;
  }

  .test-hint {
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 12px;
  }

  .test-row {
    display: flex;
    flex-wrap: wrap;
  }

  /* 收缩基准带下限：窗口变窄时换行，而不是把第二个盒子切掉 */
  .test-cell {
    flex: 1 1 200px;
    margin-right: 12px;
    margin-bottom: 12px;
  }

  .test-label {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 4px;
  }

  /* 宽度按块级规则解析，auto/100% 会撑满容器内容区；
     高度由内容驱动，空元素算出来是 0，因此必须给一个确定来源（此处为固定高度）。
     元素内部按 min(宽, 高) 换算模型缩放，所以宽度随容器变化时模型会跟着缩放 */
  machinemax-part-model {
    display: block;
    width: 100%;
    height: 220px;
    background-color: #161b22;
    border: 1px solid #30363d;
  }
</style>

<body>
  <div class="test-root">
    <div class="test-title">AUI 扩展元素 · 部件模型渲染测试</div>
    <div class="test-hint">
      硬编码部件 machine_max:wine_fox_hull（变体 default）· 模型随内容区自适应
    </div>

    <div class="test-row">
      <div class="test-cell">
        <div class="test-label">fill=0.9 / spin=0</div>
        <machinemax-part-model fill="0.9" spin="0"></machinemax-part-model>
      </div>
      <div class="test-cell">
        <div class="test-label">fill=0.6 / spin=45</div>
        <machinemax-part-model fill="0.6" spin="45"></machinemax-part-model>
      </div>
    </div>
  </div>
</body>
