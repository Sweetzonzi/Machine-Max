<!--
  Machine-Max — 武器状态 HUD · 实施页
  ==========================================================================
  由客户端 WeaponHudOverlay 创建的 AUI Overlay Document 承载：
  无 Screen 打开且未按 F1 隐藏 HUD 时由 AUI 逐帧绘制（ApricityUI 客户端入口的
  drawOverlay），绘制时机在所有 LayeredDraw 图层之后，因此盖在同类 HUD 之上。

  页面结构与取数：
    三级结构 —— 角色（主 / 副） → 武器控制器 → 发射器，一个武器块 = 一个武器控制器。
    角色来自 AbstractControllableSubsystem.getActiveWeaponControllersByRole()，
    弹种槽取第一根膛内有弹的发射器的膛内弹种（都没有膛内弹时退回它的供给者的指针态文本），
    膛内弹种不属于当前供弹弹链时给 .w-ammo 挂 is-mismatch（警示黄），
    计数取**供弹弹链**在弹药池里的全部装弹机的余量与容量之和（弹药池按实例去重，与路由无关；
    弹药池里没有这条弹链时退回该控制器已绑定供给者的合计），
    弹链选项卡每个可选弹链一条、余量取弹药池中该弹链的聚合值（与弹种槽同源），
    装填条一段 = 一发射器（多管必定出现；单管时控制器下不存在装填机制则不出现）；
    段的档位：膛内有弹 → 常亮，空膛 → 该管供给者的状态与装填/再生进度，无供给者 → 熄灭。

  槽位规则：
    槽位的「有无」由静态结构决定（发射器数、可选弹链数、是否有装填机制），
    槽位的「内容」由运行态决定（就绪 / 装填中 / 空弹只改填充比例与尾标），
    因此同一载具的 HUD 高度恒定，不随装填跳动。

  元素约定：
    #weapon-hud  唯一的容器：WeaponHudOverlay 在载具结构变化时在其中建立元素结构，
                此后每个 tick 只把取值写进已有槽位（AUI 自己比对文本与类名 token，
                未变时不触发失效）

  输入：刻意不声明 <meta name="aui-mouse-events">，HUD 叠层不参与输入，
  鼠标滚轮与快捷栏按键照常由原版处理。

  显隐：根元素（html）的 weapon-hud-hidden 类控制整体隐藏，由 WeaponHudOverlay
  在“未乘坐激活座椅 / 无激活武器控制器 / 炮镜模式”时切换；文档一经创建即保留复用。

  文本：本页不含硬编码文案，全部由 Java 写入（固定文案走 Component.translatable，
  运行期文案取自弹药标签与弹链名）。

  样式：weapon_hud.css（与静态原型页 weapon_hud_prototype.html 共用，本页用其
  .hud-overlay / html.weapon-hud-hidden 两条叠层规则）。
  ==========================================================================
-->

<meta name="aui-viewport" content="mode=gui">
<link rel="stylesheet" href="weapon_hud.css">

<body style="background: transparent;">

  <!-- 武器状态面板：内容由 WeaponHudOverlay 写入 -->
  <div class="hud hud-overlay" id="weapon-hud"></div>

</body>
