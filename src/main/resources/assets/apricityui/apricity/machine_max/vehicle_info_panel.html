<link rel="stylesheet" href="vehicle_info_panel.css">

<body>
<div class="panel">
    <div class="panel-header">
        <span class="title">载具控制</span>
        <span class="badge" id="preset-badge">default_driver</span>
        <span class="subtitle" id="seat-name">driver</span>
    </div>

    <div class="panel-body" id="panel-body">
        <!-- ===== 主页 ===== -->
        <div class="page active" id="page-main">
            <!-- 控制组 -->
            <div class="section"> 
                <div class="section-header">
                    <span class="section-title">控制组 </span>
                    <span class="section-count" id="group-count">3</span>
                    <span class="add-btn" id="btn-add-group">+ 添加</span>
                </div>
                <div class="hud-grid" id="group-list"></div>
            </div>

            <!-- GUI 控件 -->
            <div class="section">
                <div class="section-header">
                    <span class="section-title">配置项 </span>
                    <span class="section-count" id="gui-count">3</span>
                    <span class="add-btn" id="btn-add-gui">+ 添加</span>
                </div>
                <div class="ctrl-grid" id="gui-list"></div>
            </div>

            <div class="footer-actions">
                <span class="btn-reset" id="btn-reset">重置预设</span>
            </div>
        </div>

        <!-- ===== 控制组编辑页 ===== -->
        <div class="page" id="page-group-edit">
            <div class="back-bar">
                <span class="back-btn" id="btn-back-from-group">← 返回</span>
                <span class="view-title">编辑控制组</span>
            </div>
            <div class="edit-section">
                <div class="edit-section-title">控制组属性</div>
                <div class="form-field">
                    <label>名称</label>
                    <input id="ge-name" value="" style="max-width:140px;"/>
                </div>
                <div class="form-field">
                    <label>模式</label>
                    <select id="ge-mode" style="max-width:100px;">
                        <option>INHERIT</option>
                        <option>GROUND</option>
                        <option>PLANE</option>
                        <option>SHIP</option>
                        <option>MECH</option>
                    </select>
                </div>
            </div>
            <div class="edit-section">
                <div class="edit-section-title">信号输出目标</div>
                <div class="form-field">
                    <label>频道</label>
                    <input id="ge-channel" value="throttle" style="max-width:140px;"/>
                </div>
                <div class="form-field">
                    <label>目标</label>
                    <input id="ge-target" value="engine" style="max-width:140px;"/>
                </div>
            </div>
            <div class="edit-section">
                <div class="edit-section-title">按键绑定</div>
                <div class="form-field">
                    <label>按键</label>
                    <input id="ge-key" value="W" style="max-width:70px;"/>
                </div>
                <div class="form-field">
                    <label>动作</label>
                    <select id="ge-action" style="max-width:90px;">
                        <option>PRESS</option>
                        <option selected>HOLD</option>
                        <option>TOGGLE</option>
                    </select>
                </div>
            </div>
            <div class="footer-actions">
                <span class="btn-ghost" id="btn-save-group">保存</span>
                <span class="btn-ghost" id="btn-cancel-group">取消</span>
            </div>
        </div>

        <!-- ===== GUI 控件编辑页 ===== -->
        <div class="page" id="page-gui-edit">
            <div class="back-bar">
                <span class="back-btn" id="btn-back-from-gui">← 返回</span>
                <span class="view-title">编辑 GUI 控件</span>
            </div>
            <div class="edit-section">
                <div class="edit-section-title">基本信息</div>
                <div class="form-field">
                    <label>标签</label>
                    <input id="ge-label" value="" style="max-width:140px;"/>
                </div>
                <div class="form-field">
                    <label>频道</label>
                    <input id="ge-channel-input" value="" style="max-width:140px;"/>
                </div>
                <div class="form-field">
                    <label>类型</label>
                    <select id="ge-type" style="max-width:110px;">
                        <option value="toggle">Toggle</option>
                        <option value="pulse">Pulse</option>
                        <option value="slider">Slider</option>
                    </select>
                </div>
            </div>
            <div class="edit-section">
                <div class="edit-section-title">控件参数</div>
                <div style="font-size:10px;color:rgba(255,255,255,0.2);padding:6px 0;">（待实现）</div>
            </div>
            <div class="footer-actions">
                <span class="btn-ghost" id="btn-save-gui">保存</span>
                <span class="btn-ghost" id="btn-cancel-gui">取消</span>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
</body>
