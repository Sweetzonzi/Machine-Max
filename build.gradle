plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'org.jreleaser' version '1.15.0'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.20'
    id 'org.jetbrains.dokka' version '1.9.20'
}

try {
    // 单独作为项目时运行
    tasks.named('wrapper', Wrapper).configure {
        distributionType = Wrapper.DistributionType.ALL
    }
} catch (Exception ignored) {
}

version = mod_version
group = "${mod_group_id}.${mod_id}"

base {
    archivesName = "${build_name}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    jarJar {}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    // 开发期第三方 jar 的两个来源（内容在 repositories.gradle 里填，jar 不入库，见各目录 README.md）：
    //
    //   devServerMods  mods/        双端（Curios、SuperbWarfare）→ main 的 runtimeClasspath，四个 run 全加载
    //   devClientMods  mods-client/ 仅客户端（DistantHorizons、Iris、Sodium）→ 只挂 runClient
    //
    // 判据、两个不能用的落点（runtimeOnly 与 <run>AdditionalRuntimeClasspath）、GeckoLib/Spark 为什么不放
    // 这两份目录，见 AGENTS.md「开发期 mod 目录」。
    devServerMods {
        canBeConsumed = false
        canBeResolved = true
    }
    devClientMods {
        canBeConsumed = false
        canBeResolved = true
    }

    runtimeClasspath.extendsFrom localRuntime
    runtimeClasspath.extendsFrom devServerMods
}

// mods-client/ 只挂 runClient 任务自己的 classpathProvider（理由见上）。
def clientOnlyMods = configurations.getByName('devClientMods')
tasks.named('runClient').configure { runClient ->
    runClient.classpathProvider.from(clientOnlyMods)
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description,
            kotlinforforge_version : kotlinforforge_version,
            spark_core_version     : spark_core_version,
            ballistics_framework_version: ballistics_framework_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

if (rootProject.file('publishing.gradle').exists()) {
    apply from: rootProject.file('publishing.gradle')
}

if (rootProject.file('repositories.gradle').exists()) {
    apply from: rootProject.file('repositories.gradle')
}

dependencies {
    // 纯物理测试：不启动 Minecraft / GameTestServer，只用 Spark-Core 内嵌的 jme3 Bullet
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// 测试源码需要主源码的完整编译/运行类路径（Minecraft、DFU 由 moddev 直接挂在 main 上，
// 不会自动出现在 testCompileClasspath）
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

kotlin {
    jvmToolchain(21)
}

compileKotlin {
    kotlinOptions.jvmTarget = "21"
}

try {
    // 作为子模块时运行
    apply from: rootProject.file('modules/Machine-Max/repositories.gradle')
} catch (Exception ignored) {
}